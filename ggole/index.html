<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gu哥搜索</title>
    <link rel="stylesheet" href="styles.css">
    <script>
        /**
         * Startup Search Handler - Extremely fast redirect for address bar searches
         */
        (function () {
            const params = new URLSearchParams(window.location.search);
            const term = params.get('search');
            if (!term) return;

            document.documentElement.style.display = 'none';

            const ENGINES = {
                '百度': 'https://www.baidu.com/s?wd=', 'baidu': 'https://www.baidu.com/s?wd=',
                '谷歌': 'https://www.google.com/search?q=', 'google': 'https://www.google.com/search?q=',
                'googleai': 'https://www.google.com/search?udm=50&q=', '谷歌ai': 'https://www.google.com/search?udm=50&q=',
                '百度ai': 'https://chat.baidu.com/search?word=', 'meta': 'https://metaso.cn/?q=',
                '秘塔': 'https://metaso.cn/?q=', 'github': 'https://github.com/search?q=',
                'gitee': 'https://so.gitee.com/?q=', 'gpt': 'https://chatgpt.com/?q=',
                'chatgpt': 'https://chatgpt.com/?q=', 'cs': 'https://chatgpt.com/?q='
            };

            const settings = (() => {
                try { return JSON.parse(localStorage.getItem('gugooleSettings')); } catch (e) { return null; }
            })() || { domestic: 'https://www.baidu.com/s?wd=', international: 'https://www.google.com/search?q=' };

            const redirect = (url) => window.location.replace(url + encodeURIComponent(term));

            const controller = new AbortController();
            const timeout = setTimeout(() => {
                controller.abort();
                redirect(settings.domestic);
            }, 1000);

            fetch('https://www.google.com/generate_204', { mode: 'no-cors', cache: 'no-cache', signal: controller.signal })
                .then(() => { clearTimeout(timeout); redirect(settings.international); })
                .catch(() => { clearTimeout(timeout); redirect(settings.domestic); });
        })();
    </script>
</head>

<body>
    <main>
        <div class="logo-container">
            <img src="logo.png" alt="Gugoole">
            <div class="slogan">更高效的搜索控制器</div>
        </div>

        <div class="search-container">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="回车搜索或Tab键回车触发AI搜索" autofocus autocomplete="off">
                <button id="ai-search-btn" class="ai-search-btn" title="AI搜索">
                    <span>AI搜索</span>
                </button>
            </div>
            <ul id="suggestions-list" class="suggestions-list"></ul>
        </div>
    </main>

    <footer>
        <div class="footer-bottom">
            <div class="footer-left">
                <a href="#" id="footer-ip-location" title="点击刷新IP检测">检测中...</a>
            </div>
            <div class="footer-right">
                <a href="#">设置</a>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>

</html>
