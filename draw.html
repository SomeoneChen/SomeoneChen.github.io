<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数学之花绘制器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: #333;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            padding: 30px;
            margin: 20px;
            width: 95%;
            max-width: 1000px;
        }
        
        header {
            text-align: center;
            margin-bottom: 25px;
        }
        
        h1 {
            font-size: 2.5em;
            color: #4a6fa5;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }
        
        .subtitle {
            color: #666;
            font-size: 1.2em;
            margin-bottom: 20px;
        }
        
        .canvas-container {
            display: flex;
            justify-content: center;
            margin: 0 auto 25px;
            position: relative;
        }
        
        canvas {
            border: 3px solid #4a6fa5;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
            background: white;
        }
        
        .controls {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin: 20px 0;
        }
        
        .control-group {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
        }
        
        .control-item {
            display: flex;
            flex-direction: column;
            min-width: 200px;
        }
        
        label {
            font-weight: bold;
            margin-bottom: 8px;
            color: #4a6fa5;
            font-size: 1.1em;
        }
        
        input, select {
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #4a6fa5;
            box-shadow: 0 0 0 3px rgba(74, 111, 165, 0.2);
        }
        
        .speed-display {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
            color: #4a6fa5;
            font-size: 1.2em;
        }
        
        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
        }
        
        button {
            padding: 15px 30px;
            font-size: 1.1em;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            color: white;
            min-width: 150px;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        #startBtn {
            background: linear-gradient(45deg, #4CAF50, #45a049);
        }
        
        #startBtn:hover {
            background: linear-gradient(45deg, #45a049, #4CAF50);
        }
        
        #stopBtn {
            background: linear-gradient(45deg, #f44336, #d32f2f);
        }
        
        #stopBtn:hover {
            background: linear-gradient(45deg, #d32f2f, #f44336);
        }
        
        #resetBtn {
            background: linear-gradient(45deg, #2196F3, #1976D2);
        }
        
        #resetBtn:hover {
            background: linear-gradient(45deg, #1976D2, #2196F3);
        }
        
        .info-panel {
            background: #e3f2fd;
            border-left: 4px solid #4a6fa5;
            padding: 15px;
            border-radius: 0 10px 10px 0;
            margin-top: 20px;
            font-size: 0.95em;
            line-height: 1.5;
        }
        
        .info-panel h3 {
            color: #4a6fa5;
            margin-bottom: 10px;
        }
        
        .point-info {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
            text-align: center;
        }
        
        .point {
            padding: 10px;
            border-radius: 10px;
            min-width: 120px;
        }
        
        .point-a {
            background: rgba(74, 111, 165, 0.1);
            border: 2px solid #4a6fa5;
        }
        
        .point-b {
            background: rgba(244, 67, 54, 0.1);
            border: 2px solid #f44336;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 2em;
            }
            
            .control-group {
                flex-direction: column;
            }
            
            .control-item {
                min-width: 100%;
            }
            
            button {
                width: 100%;
                margin-bottom: 10px;
            }
            
            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌸 数学之花绘制器</h1>
            <p class="subtitle">探索数学之美：当两个点在圆上以不同速度运动时，连接它们的线会创造出惊人的几何图案</p>
        </header>
        
        <div class="canvas-container">
            <canvas id="flowerCanvas" width="600" height="600"></canvas>
        </div>
        
        <div class="controls">
            <div class="control-group">
                <div class="control-item">
                    <label for="bSpeed">B点速度 (A点速度=1)</label>
                    <input type="range" id="bSpeed" min="0.1" max="10" step="0.1" value="1.5">
                </div>
                <div class="control-item">
                    <label for="lineInterval">绘制间隔 (毫秒)</label>
                    <input type="range" id="lineInterval" min="10" max="200" step="5" value="50">
                </div>
                <div class="control-item">
                    <label for="lineColor">线条颜色</label>
                    <select id="lineColor">
                        <option value="#FF69B4">粉色</option>
                        <option value="#4169E1" selected>蓝色</option>
                        <option value="#32CD32">绿色</option>
                        <option value="#FF4500">橙色</option>
                        <option value="#9370DB">紫色</option>
                        <option value="#20B2AA">青色</option>
                    </select>
                </div>
            </div>
            
            <div class="speed-display" id="speedDisplay">B点速度: 1.5倍 (A点速度: 1.0倍)</div>
            
            <div class="buttons">
                <button id="startBtn">▶ 开始绘制</button>
                <button id="stopBtn">⏹ 停止</button>
                <button id="resetBtn">↺ 重置</button>
            </div>
        </div>
        
        <div class="point-info">
            <div class="point point-a">
                <strong>点 A</strong><br>
                速度: 恒定 (1.0倍)<br>
                颜色: 🔵 蓝色
            </div>
            <div class="point point-b">
                <strong>点 B</strong><br>
                速度: 可调节<br>
                颜色: 🔴 红色
            </div>
        </div>
        
        <div class="info-panel">
            <h3>💡 使用说明</h3>
            <p>• <strong>A点</strong> 以恒定速度逆时针沿圆周运动</p>
            <p>• <strong>B点</strong> 速度可通过滑块调节，也逆时针运动</p>
            <p>• 两点之间的连线会定期保留在画面上</p>
            <p>• 不同的速度比会产生不同的几何图案</p>
            <p>• 速度比为有理数时，图案会闭合；为无理数时，图案会填满整个圆</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const canvas = document.getElementById('flowerCanvas');
            const ctx = canvas.getContext('2d');
            const bSpeedSlider = document.getElementById('bSpeed');
            const lineIntervalSlider = document.getElementById('lineInterval');
            const lineColorSelect = document.getElementById('lineColor');
            const speedDisplay = document.getElementById('speedDisplay');
            const startBtn = document.getElementById('startBtn');
            const stopBtn = document.getElementById('stopBtn');
            const resetBtn = document.getElementById('resetBtn');
            
            // 画布设置
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = Math.min(canvas.width, canvas.height) * 0.4;
            
            // 动画变量
            let animationId = null;
            let lastDrawTime = 0;
            let angleA = 0; // A点角度（弧度）
            let angleB = 0; // B点角度（弧度）
            let isRunning = false;
            let lineHistory = []; // 保存历史线条
            
            // 更新速度显示
            function updateSpeedDisplay() {
                const bSpeed = parseFloat(bSpeedSlider.value);
                speedDisplay.textContent = `B点速度: ${bSpeed}倍 (A点速度: 1.0倍)`;
            }
            
            // 绘制圆形轨道
            function drawCircle() {
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                ctx.strokeStyle = '#ddd';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
            
            // 绘制点
            function drawPoint(angle, color, label) {
                const x = centerX + radius * Math.cos(angle - Math.PI/2);
                const y = centerY + radius * Math.sin(angle - Math.PI/2);
                
                // 绘制点
                ctx.beginPath();
                ctx.arc(x, y, 8, 0, Math.PI * 2);
                ctx.fillStyle = color;
                ctx.fill();
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 2;
                ctx.stroke();
                
                // 绘制标签
                ctx.font = '14px Arial';
                ctx.fillStyle = '#333';
                ctx.textAlign = 'center';
                ctx.fillText(label, x, y - 15);
            }
            
            // 绘制连接线
            function drawLine(angleA, angleB, color) {
                const x1 = centerX + radius * Math.cos(angleA - Math.PI/2);
                const y1 = centerY + radius * Math.sin(angleA - Math.PI/2);
                const x2 = centerX + radius * Math.cos(angleB - Math.PI/2);
                const y2 = centerY + radius * Math.sin(angleB - Math.PI/2);
                
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.strokeStyle = color;
                ctx.lineWidth = 1.5;
                ctx.stroke();
                
                return { x1, y1, x2, y2, color };
            }
            
            // 清除画布
            function clearCanvas() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
            
            // 重绘所有历史线条
            function redrawHistory() {
                lineHistory.forEach(line => {
                    ctx.beginPath();
                    ctx.moveTo(line.x1, line.y1);
                    ctx.lineTo(line.x2, line.y2);
                    ctx.strokeStyle = line.color;
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                });
            }
            
            // 主要动画函数
            function animate(currentTime) {
                if (!isRunning) return;
                
                // 清除画布
                clearCanvas();
                
                // 重新绘制历史线条
                redrawHistory();
                
                // 绘制圆形轨道
                drawCircle();
                
                // 获取参数
                const bSpeed = parseFloat(bSpeedSlider.value);
                const lineInterval = parseInt(lineIntervalSlider.value);
                const lineColor = lineColorSelect.value;
                
                // 计算时间差（假设60fps）
                const deltaTime = 16; // 约60fps
                
                // 更新角度（逆时针运动）
                angleA += 0.01 * deltaTime; // A点恒定速度
                angleB += 0.01 * bSpeed * deltaTime; // B点可调速度
                
                // 保持角度在0-2π范围内
                angleA %= Math.PI * 2;
                angleB %= Math.PI * 2;
                
                // 定期绘制线条
                if (currentTime - lastDrawTime > lineInterval) {
                    const line = drawLine(angleA, angleB, lineColor);
                    lineHistory.push(line);
                    lastDrawTime = currentTime;
                }
                
                // 绘制当前连接线（更亮的颜色）
                drawLine(angleA, angleB, '#FF69B4');
                
                // 绘制点
                drawPoint(angleA, '#4a6fa5', 'A');
                drawPoint(angleB, '#f44336', 'B');
                
                // 继续动画
                animationId = requestAnimationFrame(animate);
            }
            
            // 开始动画
            function startAnimation() {
                if (isRunning) return;
                isRunning = true;
                lastDrawTime = performance.now();
                animationId = requestAnimationFrame(animate);
                startBtn.disabled = true;
                stopBtn.disabled = false;
            }
            
            // 停止动画
            function stopAnimation() {
                if (!isRunning) return;
                isRunning = false;
                if (animationId) {
                    cancelAnimationFrame(animationId);
                    animationId = null;
                }
                startBtn.disabled = false;
                stopBtn.disabled = true;
            }
            
            // 重置画布
            function resetCanvas() {
                stopAnimation();
                lineHistory = [];
                angleA = 0;
                angleB = 0;
                clearCanvas();
                drawCircle();
                drawPoint(0, '#4a6fa5', 'A');
                drawPoint(0, '#f44336', 'B');
                startBtn.disabled = false;
                stopBtn.disabled = true;
            }
            
            // 事件监听器
            bSpeedSlider.addEventListener('input', updateSpeedDisplay);
            startBtn.addEventListener('click', startAnimation);
            stopBtn.addEventListener('click', stopAnimation);
            resetBtn.addEventListener('click', resetCanvas);
            
            // 初始化
            updateSpeedDisplay();
            resetCanvas();
            stopBtn.disabled = true;
            
            // 窗口大小调整处理
            window.addEventListener('resize', function() {
                if (isRunning) {
                    stopAnimation();
                    resetCanvas();
                    alert('窗口大小已调整，请重新开始绘制。');
                }
            });
        });
    </script>
</body>
</html>
