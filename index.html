    <style>
        :root {
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
            --background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --surface: rgba(255, 255, 255, 0.1);
            --surface-hover: rgba(255, 255, 255, 0.15);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.8);
            --shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: var(--background);
            color: var(--text-primary);
        }
        
        .glass-morphism {
            background: var(--surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            padding: 20px;
        }
        
        #permission-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        
        #permission-screen h2 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #fff 0%, #e0e7ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        #permission-screen p {
            margin-bottom: 30px;
            color: var(--text-secondary);
            font-size: 1rem;
        }
        
        .tutorial-box {
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 30px;
            width: 100%;
        }
        
        .tutorial-item {
            display: flex;
            align-items: flex-start;
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }
        
        .tutorial-item:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(5px);
        }
        
        .tutorial-item:last-child {
            margin-bottom: 0;
        }
        
        .tutorial-item svg {
            flex-shrink: 0;
            width: 28px;
            height: 28px;
            margin-right: 15px;
            stroke: var(--primary-color);
            stroke-width: 2.5;
        }
        
        .step-text {
            color: var(--text-primary);
            line-height: 1.6;
            font-size: 0.95rem;
        }
        
        .step-text .font-bold {
            font-weight: 600;
            color: #fff;
        }
        
        #app-screen {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            max-width: 600px;
        }
        
        .video-container {
            position: relative;
            width: 100%;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
        }
        
        #video {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        #camera-error {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            cursor: pointer;
            padding: 30px;
            border-radius: 16px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
        }
        
        #camera-error svg {
            width: 60px;
            height: 60px;
            margin-bottom: 15px;
            fill: var(--primary-color);
        }
        
        #watermark-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            gap: 15px;
        }
        
        .button {
            padding: 14px 24px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-hover) 100%);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }
        
        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.6);
        }
        
        .button:active {
            transform: translateY(0);
        }
        
        #capture-btn {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: linear-gradient(135deg, #fff 0%, #e0e7ff 100%);
            border: 6px solid rgba(255, 255, 255, 0.5);
            padding: 0;
            box-shadow: 0 8px 25px rgba(255, 255, 255, 0.3), 0 0 0 0 rgba(255, 255, 255, 0.4);
            animation: pulse 2.5s infinite;
            position: relative;
        }
        
        #capture-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60%;
            height: 60%;
            background: var(--primary-color);
            border-radius: 50%;
        }
        
        .control-button {
            background: var(--surface);
            backdrop-filter: blur(20px);
            color: var(--text-primary);
            padding: 12px 18px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 500;
            min-width: 110px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }
        
        .control-button:hover {
            background: var(--surface-hover);
            transform: translateY(-2px);
        }
        
        .control-button svg {
            width: 20px;
            height: 20px;
            stroke: var(--text-primary);
        }
        
        .control-button.loading .button-text,
        .control-button.loading .button-icon {
            display: none;
        }
        
        .control-button:not(.loading) .loading-spinner {
            display: none;
        }
        
        .hidden {
            display: none !important;
        }
        
        .loading-spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid var(--text-primary);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 8px 25px rgba(255, 255, 255, 0.3), 0 0 0 0 rgba(255, 255, 255, 0.7); }
            70% { box-shadow: 0 8px 25px rgba(255, 255, 255, 0.3), 0 0 0 15px rgba(255, 255, 255, 0); }
            100% { box-shadow: 0 8px 25px rgba(255, 255, 255, 0.3), 0 0 0 0 rgba(255, 255, 255, 0); }
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .animate-fade-in-up {
            animation: fadeInUp 0.6s ease-out forwards;
        }
        
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        
        .modal.visible {
            opacity: 1;
            pointer-events: auto;
        }
        
        .modal-content {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.2) 0%, rgba(118, 75, 162, 0.2) 100%);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 20px;
            border-radius: 20px;
            max-width: 90%;
            max-height: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: scale(0.9);
            transition: transform 0.3s ease;
            box-shadow: var(--shadow);
        }
        
        .modal.visible .modal-content {
            transform: scale(1);
        }
        
        #preview-image {
            max-width: 100%;
            max-height: 60vh;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }
        
        .modal-actions {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            width: 100%;
        }
        
        .modal-actions .button {
            flex: 1;
            min-width: 100px;
        }
        
        #camera-list-modal .modal-content {
            max-width: 450px;
            width: 90%;
        }
        
        #camera-list-modal h3 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 20px;
        }
        
        #camera-list {
            width: 100%;
            list-style: none;
            padding: 0;
        }
        
        .camera-item {
            padding: 15px 20px;
            border-radius: 12px;
            cursor: pointer;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            font-size: 15px;
            text-align: center;
        }
        
        .camera-item:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateX(5px);
        }
        
        .camera-item.active {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-hover) 100%);
            border-color: transparent;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }
        
        .message-box {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 20px;
        }
        
        .message-box.flex {
            display: flex;
        }
        
        .message-content {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(240, 240, 255, 0.95) 100%);
            border-radius: 20px;
            padding: 30px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: var(--shadow);
            animation: fadeInUp 0.3s ease-out;
        }
        
        .message-content h3 {
            color: #1e293b;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 10px;
        }
        
        .message-content p {
            color: #475569;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        
        .message-content .button {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-hover) 100%);
        }
        
        .location-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 13px;
            color: white;
            display: flex;
            align-items: center;
            gap: 6px;
            z-index: 20;
            max-width: calc(100% - 30px);
            overflow: hidden;
        }
        
        .location-badge svg {
            width: 16px;
            height: 16px;
            stroke: #3b82f6;
            flex-shrink: 0;
        }
        
        #page-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--background);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        
        #page-loader.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .loader-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
    </style>

        window._AMapSecurityConfig = {

<body>
    <div id="page-loader">
        <div class="loader-spinner"></div>
    </div>
    
    <div class="container">
        <div id="permission-screen">
            <h2>水印相机</h2>
            <p>请授予摄像头和位置权限以开始拍照</p>
            <div class="tutorial-box glass-morphism">
                <div class="tutorial-item">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M11 19H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5"></path><path d="M14 5h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-1"></path><path d="m17 12-2-2-2 2"></path><path d="m17 12 2-2 2 2"></path><path d="m7 12 2 2 2-2"></path><path d="m7 12-2 2-2-2"></path></svg>
                    <div class="step-text">
                        <span class="font-bold">切换镜头：</span>
                        <span>点击此按钮可以切换前后摄像头，长按会弹出选择列表。</span>
                    </div>
                </div>
                <div class="tutorial-item">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                    <div class="step-text">

                        <span>应用启动后会自动获取位置，也可点击按钮手动刷新定位。</span>
                    </div>
                </div>
                <div class="tutorial-item">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"></path></svg>
                    <div class="step-text">
                        <span class="font-bold">拍照按钮：</span>
                        <span>中间的圆形大按钮，点击即可拍摄带有实时水印的照片。</span>
                    </div>
                </div>
            </div>
            <button id="request-permission-btn" class="button">启动相机</button>
        </div>
        
        <div id="app-screen" class="hidden">
            <div class="video-container">
                <video id="video" playsinline autoplay muted></video>
                <canvas id="watermark-overlay"></canvas>
                <div id="location-badge" class="location-badge hidden">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                    <span id="location-text">定位中...</span>
                </div>
                <div id="camera-error" class="hidden">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 12.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Zm0-5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3ZM10.5 2h3a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-3a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5ZM12 4a.5.5 0 0 0-.5.5v1a.5.5 0 0 0 .5.5h3a.5.5 0 0 0 .5-.5v-1a.5.5 0 0 0-.5-.5h-3Z"/><path d="M2 5.5A2.5 2.5 0 0 1 4.5 3H7v1.5a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V3h2.5A2.5 2.5 0 0 1 22 5.5v13A2.5 2.5 0 0 1 19.5 21h-15A2.5 2.5 0 0 1 2 18.5v-13ZM20 5.5a.5.5 0 0 0-.5-.5h-15a.5.5 0 0 0-.5.5v13a.5.5 0 0 0 .5.5h15a.5.5 0 0 0 .5-.5v-13Z"/></svg>
                    <p>摄像头权限获取失败<br>点击此处重试</p>
                </div>
            </div>
            <div class="controls">
                <button id="getLocationBtn" class="control-button" title="获取位置">
                    <svg class="button-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                    <span class="button-text">定位</span>
                    <div class="loading-spinner"></div>

                <button id="capture-btn" title="拍照"></button>
                <button id="switch-camera-btn" class="control-button" title="切换摄像头">
                    <svg class="button-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M11 19H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5"></path><path d="M14 5h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-1"></path><path d="m17 12-2-2-2 2"></path><path d="m17 12 2-2 2 2"></path><path d="m7 12 2 2 2-2"></path><path d="m7 12-2 2-2-2"></path></svg>
                    <span class="button-text">镜头</span>
                </button>
            </div>
        </div>
    </div>
    
    <div id="preview-modal" class="modal hidden">
        <div class="modal-content">
            <img id="preview-image" alt="照片预览">
            <p id="wechat-save-tip" class="hidden text-sm" style="color: rgba(255,255,255,0.8); margin-bottom: 10px;">长按图片保存至相册</p>
            <div class="modal-actions">
                <button id="close-modal-btn" class="button">重拍</button>
                <a href="http://nxjy.nhedu.net/student/index.html" target="_blank" rel="noopener noreferrer">
                    <button class="button" style="background: linear-gradient(135deg, #10b981 0%, #059669 100%);">去打卡</button>
                </a>
                <a id="download-link" download>
                    <button class="button">下载</button>
                </a>
            </div>
        </div>
    </div>
    
    <div id="camera-list-modal" class="modal hidden">
        <div class="modal-content">
            <h3>选择摄像头</h3>
            <ul id="camera-list"></ul>
        </div>
    </div>
    
    <div id="messageBox" class="message-box">
        <div class="message-content">
            <h3 id="messageTitle"></h3>
            <p id="messageText"></p>
            <button onclick="closeMessageBox()" class="button">确定</button>
        </div>
    </div>
    
    <canvas id="photo-canvas" class="hidden"></canvas>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const pageLoader = document.getElementById('page-loader');
            const permissionScreen = document.getElementById('permission-screen');
            const appScreen = document.getElementById('app-screen');
            const requestPermissionBtn = document.getElementById('request-permission-btn');
            
            const video = document.getElementById('video');
            const watermarkOverlay = document.getElementById('watermark-overlay');
            const photoCanvas = document.getElementById('photo-canvas');
            const cameraError = document.getElementById('camera-error');
            const locationBadge = document.getElementById('location-badge');
            const locationText = document.getElementById('location-text');
            
            const captureBtn = document.getElementById('capture-btn');
            const getLocationBtn = document.getElementById('getLocationBtn');
            const switchCameraBtn = document.getElementById('switch-camera-btn');
            
            const previewModal = document.getElementById('preview-modal');
            const previewImage = document.getElementById('preview-image');
            const closeModalBtn = document.getElementById('close-modal-btn');
            const downloadLink = document.getElementById('download-link');
            const wechatSaveTip = document.getElementById('wechat-save-tip');
            
            const cameraListModal = document.getElementById('camera-list-modal');
            const cameraList = document.getElementById('camera-list');
            
            const messageBox = document.getElementById('messageBox');
            const messageTitle = document.getElementById('messageTitle');
            const messageText = document.getElementById('messageText');
            
            let currentStream;
            let availableCameras = [];
            let selectedDeviceId = null;
            let watermarkTimer;
            let locationInfo = { text: null, lng: null, lat: null };
            
            const dayNames = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
            const isWeChat = /micromessenger/i.test(navigator.userAgent);
            
            window.onload = () => {
                pageLoader.classList.add('hidden');
                setTimeout(() => pageLoader.style.display = 'none', 500);
            };
            
            function showModal(modalElement) {
                modalElement.classList.remove('hidden');
                setTimeout(() => modalElement.classList.add('visible'), 10);
            }
            
            function hideModal(modalElement) {
                modalElement.classList.remove('visible');
                setTimeout(() => modalElement.classList.add('hidden'), 300);
            }
            
            function showMessageBox(title, text) {
                messageTitle.textContent = title;
                messageText.textContent = text;
                messageBox.classList.remove('hidden');
                messageBox.classList.add('flex');
            }
            
            window.closeMessageBox = function() {
                messageBox.classList.remove('flex');
                messageBox.classList.add('hidden');
            }
            
            function setCookie(name, value, days) {
                const d = new Date();
                d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));
                document.cookie = name + "=" + value + ";expires=" + d.toUTCString() + ";path=/";
            }
            
            function getCookie(name) {
                const cname = name + "=";
                const decodedCookie = decodeURIComponent(document.cookie);
                const ca = decodedCookie.split(';');
                for(let i = 0; i < ca.length; i++) {
                    let c = ca[i];
                    while (c.charAt(0) === ' ') c = c.substring(1);
                    if (c.indexOf(cname) === 0) return c.substring(cname.length, c.length);
                }
                return "";
            }
            
            async function getCameras() {
                try {
                    let devices = await navigator.mediaDevices.enumerateDevices();
                    let videoDevices = devices.filter(device => device.kind === 'videoinput');
                    
                    if (videoDevices.length === 0 || !videoDevices[0].deviceId) {
                        const tempStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                        tempStream.getTracks().forEach(track => track.stop());
                        devices = await navigator.mediaDevices.enumerateDevices();
                        videoDevices = devices.filter(device => device.kind === 'videoinput');
                    }
                    
                    availableCameras = videoDevices;
                    switchCameraBtn.classList.toggle('hidden', availableCameras.length <= 1);
                    
                    const savedDeviceId = getCookie('selectedDeviceId');
                    if (savedDeviceId && availableCameras.find(cam => cam.deviceId === savedDeviceId)) {
                        selectedDeviceId = savedDeviceId;
                    } else if (availableCameras.length > 0) {
                        // 优先查找后置摄像头
                        const backCamera = availableCameras.find(cam => 
                            /front|rear|face|environment|前置/i.test(cam.label)
                        );
                        selectedDeviceId = backCamera ? backCamera.deviceId : availableCameras[0].deviceId;
                    }
                    
                    populateCameraList();
                } catch (err) {
                    console.error("无法获取设备列表:", err);
                    switchCameraBtn.classList.add('hidden');
                    throw err;
                }
            }
            
            function populateCameraList() {
                cameraList.innerHTML = '';
                availableCameras.forEach(camera => {
                    const li = document.createElement('li');
                    li.classList.add('camera-item');
                    li.textContent = camera.label || '未知摄像头';
                    li.dataset.deviceId = camera.deviceId;
                    if (camera.deviceId === selectedDeviceId) {
                        li.classList.add('active');
                    }
                    li.addEventListener('click', async () => {
                        selectedDeviceId = camera.deviceId;
                        setCookie('selectedDeviceId', selectedDeviceId, 365);
                        hideModal(cameraListModal);
                        populateCameraList();
                        await startCamera(selectedDeviceId);
                    });
                    cameraList.appendChild(li);
                });
            }
            
            function stopCurrentStream() {
                if (currentStream) {
                    currentStream.getTracks().forEach(track => track.stop());
                    currentStream = null;
                }
            }
            
            async function startCamera(deviceId = null) {
                stopCurrentStream();
                const constraints = {
                    video: {
                        deviceId: deviceId ? { exact: deviceId } : undefined,
                        width: { ideal: 1920 },
                        height: { ideal: 1080 },
                        facingMode: deviceId ? undefined : { ideal: 'environment' }
                    }
                };
                
                try {
                    const stream = await navigator.mediaDevices.getUserMedia(constraints);
                    video.srcObject = stream;
                    currentStream = stream;
                    
                    const videoTrack = stream.getVideoTracks()[0];
                    const settings = videoTrack.getSettings();
                    video.style.transform = (settings.facingMode === 'user') ? 'scaleX(-1)' : 'scaleX(1)';
                    
                    cameraError.classList.add('hidden');
                    video.classList.remove('hidden');
                    
                    video.onloadedmetadata = () => {
                        watermarkOverlay.width = video.videoWidth || video.offsetWidth;
                        watermarkOverlay.height = video.videoHeight || video.offsetHeight;
                        clearInterval(watermarkTimer);
                        watermarkTimer = setInterval(drawRealtimeWatermark, 1000);
                        drawRealtimeWatermark();
                    };
                } catch (err) {
                    console.error("摄像头启动失败:", err);
                    cameraError.classList.remove('hidden');
                    video.classList.add('hidden');
                    
                    if (err.name === 'NotAllowedError') {
                        showMessageBox('没相机用', '666不给权限怎么玩');
                    } else if (err.name === 'NotFoundError' || err.name === 'OverconstrainedError') {
                        if (deviceId) {
                            await startCamera(null);
                        } else {
                            showMessageBox('相机错误', '666相机炸了');
                        }
                    } else {
                        showMessageBox('相机错误', '摄像头私了: ' + err.message);
                    }
                }
            }
            
            function wrapText(context, text, x, y, maxWidth, lineHeight) {
                const words = text.split('');
                let line = '';
                let lines = [];
                
                for (let n = 0; n < words.length; n++) {
                    let testLine = line + words[n];
                    if (context.measureText(testLine).width > maxWidth && n > 0) {
                        lines.push(line);
                        line = words[n];
                    } else {
                        line = testLine;
                    }
                }
                lines.push(line);
                
                const totalBlockHeight = (lines.length - 1) * lineHeight;
                let startY = y - totalBlockHeight;
                
                for (let i = 0; i < lines.length; i++) {
                    context.fillText(lines[i], x, startY + (i * lineHeight));
                }
                return totalBlockHeight + lineHeight;
            }
            
            function drawWatermark(ctx, canvasWidth, canvasHeight) {
                const now = new Date();
                const dateText = `${now.getFullYear()}.${(now.getMonth() + 1).toString().padStart(2, '0')}.${now.getDate().toString().padStart(2, '0')} ${dayNames[now.getDay()]}`;
                const timeText = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
                
                const baseFontSize = Math.max(12, Math.floor(canvasHeight / 60));
                const smallTextFontSize = baseFontSize * 1.4;
                const timeFontSize = baseFontSize * 8.0;
                
                const horizontalPadding = Math.max(25, canvasWidth * 0.04);
                const bottomMargin = horizontalPadding * 0.8;
                const gap = baseFontSize * 2.0;
                
                ctx.shadowColor = "rgba(0, 0, 0, 0.5)";
                ctx.shadowBlur = 8;
                ctx.shadowOffsetX = 0;
                ctx.shadowOffsetY = 3;
                
                ctx.font = `300 ${smallTextFontSize}px "Helvetica Neue", Arial, sans-serif`;
                ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                ctx.textAlign = 'right';
                ctx.textBaseline = 'bottom';
                ctx.fillText("水印相机", canvasWidth - horizontalPadding, canvasHeight - bottomMargin);
                
                const dateLocationBaselineY = canvasHeight - bottomMargin - smallTextFontSize - gap;
                ctx.font = `300 ${smallTextFontSize}px "Helvetica Neue", Arial, sans-serif`;
                ctx.fillStyle = 'white';
                ctx.textAlign = 'center';
                
                let combinedText = dateText;
                if (locationInfo.text) {
                    combinedText += ` 📍 ${locationInfo.text}`;
                }
                
                const dateLineHeight = smallTextFontSize * 1.4;
                const maxWidth = canvasWidth - 2 * horizontalPadding;
                const textBlockHeight = wrapText(ctx, combinedText, canvasWidth / 2, dateLocationBaselineY, maxWidth, dateLineHeight);
                
                const timeBaselineY = dateLocationBaselineY - textBlockHeight;
                ctx.font = `200 ${timeFontSize}px "Helvetica Neue", Arial, sans-serif`;
                ctx.fillText(timeText, canvasWidth / 2, timeBaselineY);
                
                ctx.shadowColor = "transparent";
                ctx.shadowBlur = 0;
            }
            
            function drawRealtimeWatermark() {
                const ctx = watermarkOverlay.getContext('2d');
                ctx.clearRect(0, 0, watermarkOverlay.width, watermarkOverlay.height);
                drawWatermark(ctx, watermarkOverlay.width, watermarkOverlay.height);
            }
            
            function processImage(sourceElement) {
                const ctx = photoCanvas.getContext('2d');
                const sourceWidth = sourceElement.videoWidth;
                const sourceHeight = sourceElement.videoHeight;
                photoCanvas.width = sourceWidth;
                photoCanvas.height = sourceHeight;
                
                const videoTrack = currentStream.getVideoTracks()[0];
                const facingMode = videoTrack.getSettings().facingMode;
                
                if (facingMode === 'user') {
                    ctx.translate(photoCanvas.width, 0);
                    ctx.scale(-1, 1);
                }
                
                ctx.drawImage(sourceElement, 0, 0, photoCanvas.width, photoCanvas.height);
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                drawWatermark(ctx, photoCanvas.width, photoCanvas.height);
                
                const dataUrl = photoCanvas.toDataURL('image/jpeg', 0.9);
                previewImage.src = dataUrl;
                downloadLink.href = dataUrl;
                
                const timestamp = new Date();
                downloadLink.download = `水印相机_${timestamp.getFullYear()}-${(timestamp.getMonth() + 1).toString().padStart(2, '0')}-${timestamp.getDate().toString().padStart(2, '0')}.jpg`;
                
                downloadLink.classList.toggle('hidden', isWeChat);
                wechatSaveTip.classList.toggle('hidden', !isWeChat);
                
                showModal(previewModal);
                stopCurrentStream();
                clearInterval(watermarkTimer);
            }
            
            function startLocationLookup() {
                if (typeof AMap === 'undefined') {
                    showMessageBox('高德地图炸了', '定位服务暂不可用，检测是不是网炸了还是没开定位');
                    return;
                }
                
                locationText.textContent = '寻找漂唱地点...';
                locationBadge.classList.remove('hidden');
                getLocationBtn.disabled = true;
                getLocationBtn.classList.add('loading');
                
                const geolocation = new AMap.Geolocation({
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0,
                    convert: true,
                });
                
                geolocation.getCurrentPosition((status, result) => {
                    getLocationBtn.disabled = false;
                    getLocationBtn.classList.remove('loading');
                    
                    if (status === 'complete') {
                        locationInfo.lng = result.position.lng;
                        locationInfo.lat = result.position.lat;
                        
                        const geocoder = new AMap.Geocoder();
                        geocoder.getAddress(result.position, (status, geocodeResult) => {
                            if (status === 'complete' && geocodeResult.regeocode) {
                                locationInfo.text = geocodeResult.regeocode.formattedAddress;
                                locationText.textContent = locationInfo.text;
                            } else {
                                locationInfo.text = "无法解析地址";
                                locationText.textContent = locationInfo.text;
                                console.error("AMap Geocoder Error:", geocodeResult);
                            }
                            drawRealtimeWatermark();
                        });
                    } else {
                        console.error('AMap Geolocation error:', result);
                        locationInfo.text = null;
                        locationBadge.classList.add('hidden');
                        drawRealtimeWatermark();
                        
                        let errorMsg = '漂唱地点寻找失败，检查系统定位权限。';
                        if(result.message && result.message.includes('Geolocation permission denied')) {
                            errorMsg = '您拒绝了定位权限或者没开GPS，无法寻找漂唱地点。';
                        } else if (result.message && result.message.includes('timeout')) {
                            errorMsg = '定位超时,老表没信号喔';
                        }
                        showMessageBox('漂唱地点寻找失败', errorMsg);
                    }
                });
            }
            
            // 事件监听器
            requestPermissionBtn.addEventListener('click', async () => {
                try {
                    permissionScreen.classList.add('hidden');
                    appScreen.classList.remove('hidden');
                    appScreen.classList.add('animate-fade-in-up');
                    await getCameras();
                    await startCamera(selectedDeviceId);
                    // 启动后自动获取位置
                    setTimeout(() => {
                        if (typeof AMap !== 'undefined') {
                            startLocationLookup();
                        }
                    }, 500);
                } catch (err) {
                    console.error("启动相机失败:", err);
                    permissionScreen.classList.remove('hidden');
                    appScreen.classList.add('hidden');
                    if (err.name === 'NotAllowedError') {
                        showMessageBox('权限被拒绝', '请允许相机权限后刷新页面重试');
                    } else {
                        showMessageBox('启动失败', '无法启动相机: ' + err.message);
                    }
                }
            });
            
            cameraError.addEventListener('click', () => startCamera(selectedDeviceId));
            
            captureBtn.addEventListener('click', () => {
                if (currentStream && currentStream.active) {
                    processImage(video);
                } else {
                    showMessageBox('爆米花', '摄像头未启动或无权限，请重试。');
                }
            });
            
            getLocationBtn.addEventListener('click', startLocationLookup);
            
            let touchStartTime = 0;
            const longPressDuration = 500;
            
            switchCameraBtn.addEventListener('touchstart', (e) => {
                touchStartTime = Date.now();
                e.preventDefault();
            }, { passive: false });
            
            switchCameraBtn.addEventListener('touchend', (e) => {
                const touchDuration = Date.now() - touchStartTime;
                if (touchDuration > longPressDuration) {
                    if (availableCameras.length > 1) {
                        showModal(cameraListModal);
                    }
                } else {
                    if (availableCameras.length > 1) {
                        const currentIndex = availableCameras.findIndex(cam => cam.deviceId === selectedDeviceId);
                        selectedDeviceId = availableCameras[(currentIndex + 1) % availableCameras.length].deviceId;
                        setCookie('selectedDeviceId', selectedDeviceId, 365);
                        populateCameraList();
                        startCamera(selectedDeviceId);
                    }
                }
                touchStartTime = 0;
            });
            
            switchCameraBtn.addEventListener('click', (e) => {
                if (e.detail === 0) return;
                
                if (availableCameras.length > 1) {
                    const currentIndex = availableCameras.findIndex(cam => cam.deviceId === selectedDeviceId);
                    selectedDeviceId = availableCameras[(currentIndex + 1) % availableCameras.length].deviceId;
                    setCookie('selectedDeviceId', selectedDeviceId, 365);
                    populateCameraList();
                    startCamera(selectedDeviceId);
                }
            });
            
            closeModalBtn.addEventListener('click', () => {
                hideModal(previewModal);
                startCamera(selectedDeviceId);
            });
            
            cameraListModal.addEventListener('click', (e) => {
                if (e.target.id === 'camera-list-modal') {
                    hideModal(cameraListModal);
                }
            });
        });
    </script>
</body>
