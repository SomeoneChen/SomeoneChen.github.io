<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>无人机法规 · 练习</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent
    }

    :root {
      --bg: #f5f8fc;
      --card: #fff;
      --primary: #3a7bd5;
      --accent: #5bb8f5;
      --water: #e8f4fd;
      --text: #2c3e50;
      --sub: #8a9bb5;
      --correct: #4caf93;
      --wrong: #e06c75;
      --border: #e4ecf5;
      --overlay: rgba(44, 62, 80, .3);
      --header-bg: rgba(255, 255, 255, .88);
    }

    [data-theme="dark"] {
      --bg: #121212;
      --card: #1e1e1e;
      --primary: #4a90e2;
      --accent: #63b3ed;
      --water: #1a2635;
      --text: #e0e0e0;
      --sub: #8899a6;
      --correct: #3a9679;
      --wrong: #d35f67;
      --border: #2c2c2c;
      --overlay: rgba(0, 0, 0, .6);
      --header-bg: rgba(30, 30, 30, .88);
    }

    html,
    body {
      height: 100%;
      font-family: 'Noto Sans SC', 'Hiragino Sans', 'PingFang SC', sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
      transition: background 0.3s, color 0.3s;
    }

    /* ── top bar ── */
    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: var(--header-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      z-index: 100;
      font-size: 14px;
    }

    .left-actions,
    .right-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .timer {
      font-variant-numeric: tabular-nums;
      color: var(--text);
      font-weight: 500;
      font-size: 15px;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }

    .icon-btn {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: var(--water);
      border-radius: 8px;
      cursor: pointer;
      color: var(--primary);
      transition: background .2s;
    }

    .icon-btn:active {
      background: var(--border)
    }

    .icon-btn svg {
      width: 18px;
      height: 18px;
    }

    .moon-icon {
      display: none;
    }

    [data-theme="dark"] .sun-icon {
      display: none;
    }

    [data-theme="dark"] .moon-icon {
      display: block;
    }

    .text-btn {
      border: none;
      background: var(--primary);
      color: #fff;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: transform 0.15s, background 0.2s, color 0.2s;
    }

    .text-btn:active {
      transform: scale(0.95);
    }

    .text-btn.submitted {
      background: var(--water);
      color: var(--primary);
    }



    /* ── progress ── */
    .progress-track {
      position: fixed;
      top: 52px;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--border);
      z-index: 99;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      transition: width .35s cubic-bezier(.4, 0, .2, 1);
      border-radius: 0 1px 1px 0;
    }

    /* ── main container ── */
    .main {
      position: fixed;
      top: 54px;
      bottom: 56px;
      left: 0;
      right: 0;
      overflow: hidden;
    }

    /* ── slide wrapper ── */
    .slide-wrapper {
      width: 100%;
      height: 100%;
      position: relative;
      transition: filter 0.3s;
    }

    .slide-wrapper.blurred {
      filter: blur(8px);
      pointer-events: none;
    }

    .slide {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 20px 16px 32px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      will-change: transform, opacity;
      transition: transform .32s cubic-bezier(.4, 0, .2, 1), opacity .32s cubic-bezier(.4, 0, .2, 1);
    }

    .slide.center {
      transform: translateX(0);
      opacity: 1
    }

    .slide.left {
      transform: translateX(-40%);
      opacity: 0;
      pointer-events: none
    }

    .slide.right {
      transform: translateX(40%);
      opacity: 0;
      pointer-events: none
    }

    /* ── question card ── */
    .q-num {
      font-size: 12px;
      color: var(--sub);
      margin-bottom: 8px;
      font-weight: 400;
      letter-spacing: .3px;
    }

    .q-stem {
      font-size: 16px;
      line-height: 1.6;
      font-weight: 500;
      margin-bottom: 24px;
      color: var(--text);
      word-break: break-word;
    }

    /* ── options ── */
    .options {
      display: flex;
      flex-direction: column;
      gap: 12px
    }

    .opt {
      position: relative;
      display: flex;
      align-items: flex-start;
      padding: 14px 16px;
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      cursor: pointer;
      transition: border-color .18s, background .18s, transform .18s;
      -webkit-user-select: none;
      user-select: none;
    }

    .opt:active:not(.disabled) {
      transform: scale(.98)
    }

    .opt .label {
      flex-shrink: 0;
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      background: var(--water);
      font-size: 13px;
      font-weight: 600;
      color: var(--primary);
      margin-right: 12px;
      transition: background .18s, color .18s;
    }

    .opt .content {
      font-size: 15px;
      line-height: 1.5;
      padding-top: 2px;
      color: var(--text);
    }

    .opt.selected {
      border-color: var(--primary);
      background: var(--water)
    }

    .opt.selected .label {
      background: var(--primary);
      color: #fff
    }

    .opt.correct {
      border-color: var(--correct);
      background: rgba(76, 175, 147, 0.1)
    }

    .opt.correct .label {
      background: var(--correct);
      color: #fff
    }

    .opt.wrong {
      border-color: var(--wrong);
      background: rgba(224, 108, 117, 0.1)
    }

    .opt.wrong .label {
      background: var(--wrong);
      color: #fff
    }

    .opt.disabled {
      pointer-events: none
    }

    .opt.dimmed {
      opacity: .45
    }

    /* ── analysis ── */
    .analysis {
      margin-top: 20px;
      padding: 16px;
      background: var(--water);
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.7;
      color: var(--sub);
      display: none;
      animation: fadeUp .3s ease-out;
    }

    .analysis.show {
      display: block
    }

    .analysis strong {
      color: var(--text);
      font-weight: 600
    }

    /* ── animations ── */
    @keyframes shake {

      0%,
      100% {
        transform: translateX(0);
      }

      25% {
        transform: translateX(-6px);
      }

      50% {
        transform: translateX(6px);
      }

      75% {
        transform: translateX(-6px);
      }
    }

    .opt.wrong.shake {
      animation: shake 0.4s cubic-bezier(.36, .07, .19, .97) both;
    }

    @keyframes sparkle {
      0% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(76, 175, 147, .4);
      }

      50% {
        transform: scale(1.03);
        box-shadow: 0 0 0 15px rgba(76, 175, 147, 0);
      }

      100% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(76, 175, 147, 0);
      }
    }

    .opt.correct.sparkle {
      animation: sparkle 0.5s ease-out both;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(10px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    /* ── Modals ── */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--overlay);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 200;
      display: none;
      opacity: 0;
      transition: opacity .3s;
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal-overlay.visible {
      opacity: 1
    }

    /* Answer Card */
    .modal-overlay.ac-wrapper {
      align-items: flex-end;
      justify-content: center;
    }

    .answer-card {
      width: 100%;
      max-width: 480px;
      max-height: 80vh;
      background: var(--card);
      border-radius: 24px 24px 0 0;
      padding: 24px 20px 32px;
      overflow-y: auto;
      transform: translateY(100%);
      transition: transform .4s cubic-bezier(.175, .885, .32, 1.1);
      box-shadow: 0 -4px 24px rgba(0, 0, 0, 0.06);
    }

    .modal-overlay.visible .answer-card {
      transform: translateY(0)
    }

    .ac-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .ac-header h3 {
      font-size: 16px;
      font-weight: 600;
      color: var(--text)
    }

    .ac-stats {
      font-size: 13px;
      color: var(--sub)
    }

    .ac-close {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: var(--bg);
      border-radius: 10px;
      cursor: pointer;
    }

    .ac-close svg {
      width: 16px;
      height: 16px;
      color: var(--sub)
    }

    .ac-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(42px, 1fr));
      gap: 10px;
    }

    .ac-cell {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border: 1.5px solid var(--border);
      background: var(--bg);
      color: var(--sub);
      transition: transform .15s, border-color .15s;
    }

    .ac-cell:active {
      transform: scale(.92)
    }

    .ac-cell.done-correct {
      background: rgba(76, 175, 147, 0.1);
      border-color: var(--correct);
      color: var(--correct);
    }

    .ac-cell.done-wrong {
      background: rgba(224, 108, 117, 0.1);
      border-color: var(--wrong);
      color: var(--wrong);
    }

    .ac-cell.current {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--water);
    }

    /* Dialog */
    .modal-overlay.dialog-wrapper {
      align-items: center;
      justify-content: center;
    }

    .dialog {
      width: 320px;
      background: var(--card);
      border-radius: 20px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
      transform: scale(0.9);
      transition: transform 0.3s cubic-bezier(.175, .885, .32, 1.275);
    }

    .modal-overlay.visible .dialog {
      transform: scale(1);
    }

    .dialog-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 12px;
    }

    .dialog-msg {
      font-size: 14px;
      color: var(--sub);
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .dialog-actions {
      display: flex;
      gap: 12px;
    }

    .dialog-btn {
      flex: 1;
      padding: 12px 0;
      border-radius: 10px;
      border: none;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
    }

    .dialog-btn:active {
      transform: scale(0.96);
    }

    .dialog-btn.secondary {
      background: var(--water);
      color: var(--text);
    }

    .dialog-btn.primary {
      background: var(--primary);
      color: #fff;
    }

    /* Result Card */
    .modal-overlay.result-wrapper {
      align-items: center;
      justify-content: center;
    }

    .result-close {
      position: absolute;
      top: 12px; right: 12px;
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      border: none; background: var(--bg);
      border-radius: 50%; cursor: pointer;
      z-index: 2;
      transition: background 0.2s, transform 0.15s;
    }
    .result-close:active { transform: scale(0.92); background: var(--border); }
    .result-close svg { width: 16px; height: 16px; color: var(--sub); }

    .result-card { position: relative; }

    .result-card {
      width: 90%;
      max-width: 340px;
      background: var(--card);
      border-radius: 24px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      transform: scale(0.9);
      transition: transform 0.3s cubic-bezier(.175, .885, .32, 1.275);
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-overlay.visible .result-card {
      transform: scale(1);
    }

    .score-title {
      font-size: 16px;
      color: var(--sub);
      font-weight: 500;
    }

    .score-val {
      font-size: 80px;
      font-weight: 700;
      color: var(--primary);
      margin: 8px 0;
      line-height: 1;
      font-family: system-ui, -apple-system, sans-serif;
      letter-spacing: -2px;
    }

    .score-stats {
      font-size: 14px;
      color: var(--sub);
      margin-bottom: 24px;
      background: var(--bg);
      padding: 10px;
      border-radius: 12px;
    }

    .res-btn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      margin-bottom: 12px;
      transition: 0.2s;
    }

    .res-btn:active {
      transform: scale(0.97);
    }

    .res-btn.primary {
      background: var(--primary);
      color: #fff;
    }

    .res-btn.outline {
      background: transparent;
      border: 1.5px solid var(--primary);
      color: var(--primary);
    }

    .res-btn.secondary {
      background: var(--water);
      color: var(--text);
      margin-bottom: 0;
    }

    .res-btn.screenshot {
      background: #2c3e50;
      color: #fff;
    }

    /* Pause Overlay */
    .pause-overlay {
      position: fixed;
      top: 54px;
      bottom: 56px;
      left: 0;
      right: 0;
      background: transparent;
      z-index: 150;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    [data-theme="dark"] .pause-overlay {
      background: transparent;
    }

    .pause-overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .pause-icon {
      width: 48px;
      height: 48px;
      color: var(--primary);
      margin-bottom: 16px;
    }

    .pause-text {
      font-size: 18px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 24px;
    }

    .resume-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 12px 32px;
      border-radius: 20px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(58, 123, 213, 0.3);
      transition: transform 0.2s;
    }

    .resume-btn:active {
      transform: scale(0.95);
    }

    /* Report Card (Screenshot View) */
.report-overlay {
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:#f5f8fc;
  z-index:300;
  display:none;
  opacity:0;
  transition:opacity .3s;
  overflow-y:auto;
}
.report-overlay.show{display:block;}
.report-overlay.visible{opacity:1;}
.result-page { background: #fff; z-index: 1000; max-width: 480px; margin: 0 auto; width: 100%; min-height: 100vh; position: relative; padding-bottom: 20px;}
.result-page * { box-sizing: border-box; }
.xiaoetong-close-report {
  position: absolute; top: 16px; right: 16px; z-index: 10;
  width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,0.08); border-radius: 50%; cursor: pointer;
}
.result-page .bg-cover { position: relative; width: 100%; height: 319px; max-width: 480px; margin: 0 auto; }
.result-page .bg-cover .result-score-cover {
  position: absolute; top: 108px; left: 50%; display: flex; flex-direction: column; align-items: center;
  width: 165px; height: 165px; font-weight: 400; padding-top: 20px; font-size: 15px; text-align: center;
  margin-left: -82.5px; color: #333; z-index: 1;
}
.result-page .bg-cover .result-score-cover .score { 
  position: relative; font-size: 54px; font-weight: 700; line-height: 1.1; 
  font-family: "DIN Alternate", "Helvetica Neue", Helvetica, Arial, sans-serif; 
}
.result-page .bg-cover .result-score-cover .score:after { content: "%"; position: absolute; bottom: 8px; right: -20px; font-size: 16px; font-weight: 400; font-family: PingFangSC-Regular, sans-serif; }
.result-page .bg-cover img { position: absolute; top: 30px; width: 100%; left: 0; }
.result-page .tip { width: 100%; text-align: center; font-size: 15px; font-family: PingFangSC-Regular,PingFang SC; font-weight: 400; color: #3f72d9; line-height: 20px; letter-spacing: 2px; margin-top: -15px; margin-bottom: 42px; }
.result-page .result-info { justify-content: center; width: 100%; margin-bottom: 30px; display: flex; align-items: center; }
.result-page .result-info .item { display: flex; align-items: center; flex-direction: column; width: 111px; }
.result-page .result-info .item .title { color: #888; font-size: 13px; margin-bottom: 6px; }
.result-page .result-info .item .content { font-weight: 400; font-size: 18px; color: #333; font-family: "DIN Alternate", "Helvetica Neue", Arial, sans-serif; }
.result-page .result-info .split { height: 28px; border-left: 1px solid #eee; }
.result-page .btn-group { display: flex; align-items: center; flex-direction: column; margin-bottom: 18px; }
.result-page .btn-group .btn { width: 311px; height: 48px; line-height: 48px; text-align: center; border-radius: 24px; font-size: 18px; color: #fff; letter-spacing: 1px; background: #105cfb; cursor: pointer; }
.result-page .btn-group .go-on-practice { color: #105cfb; margin-top: 22px; background: #fff; border: 1px solid #105cfb; }

/* ── bottom nav ── */
    .bottombar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: var(--header-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      z-index: 50;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      gap: 4px;
      border: none;
      background: none;
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      cursor: pointer;
      padding: 8px 12px;
      border-radius: 8px;
      transition: background .15s, color .15s;
      font-family: inherit;
    }

    .nav-btn:active {
      background: var(--water)
    }

    .nav-btn svg {
      width: 18px;
      height: 18px
    }

    .nav-btn.disabled {
      opacity: .3;
      pointer-events: none
    }

    .counter {
      font-size: 14px;
      color: var(--sub);
      font-variant-numeric: tabular-nums;
      font-weight: 500;
    }

    /* ── scrollbar ── */
    .slide::-webkit-scrollbar {
      width: 0
    }

    .answer-card::-webkit-scrollbar {
      width: 4px
    }

    .answer-card::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 2px
    }

    /* Loading Overlay */
    #loadingOverlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--bg);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.35s ease-out;
    }
    #loadingOverlay.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    /* Page entrance animation */
    .main-content-enter {
      animation: fadeInUp 0.45s cubic-bezier(.4,0,.2,1) both;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--water);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ── safe area ── */
    @supports(padding-bottom:env(safe-area-inset-bottom)) {
      .bottombar {
        padding-bottom: env(safe-area-inset-bottom);
        height: calc(56px + env(safe-area-inset-bottom))
      }

      .main {
        bottom: calc(56px + env(safe-area-inset-bottom))
      }

      .modal-overlay .answer-card {
        padding-bottom: calc(32px + env(safe-area-inset-bottom))
      }

      .report-container {
        padding-bottom: calc(24px + env(safe-area-inset-bottom));
      }
    }
  </style>
</head>

  <script>
    (function () {
      var urlParams = new URLSearchParams(window.location.search);
      var bankFile = urlParams.get('bank');
      if (!bankFile) {
        window.location.replace('index.html');
        return;
      }

      // 同步主页面的主题
      var savedTheme = localStorage.getItem('uav_quiz_theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);

      var STORAGE_KEY = 'uav_quiz_state_' + bankFile;
      var RAW_DATA = null;

      var state = {
        theme: savedTheme,
        order: [],
        records: {},
        elapsedSec: 0,
        current: 0,
        submitted: false,
        mode: 'normal', randomizeOpts: false, shuffledOpts: {} };

      var questions = [];
      var current = 0;
      var timerInterval = null;
      var manualPaused = false; var blurPaused = false;

      // 浏览器返回时使用 bfcache，立即隐藏 loading
      function hideLoaderImmediately() {
        var loader = document.getElementById('loadingOverlay');
        if (loader) {
          loader.classList.add('fade-out');
          loader.style.display = 'none';
        }
      }
      // pageshow 事件：处理 bfcache 恢复
      window.addEventListener('pageshow', function (event) {
        if (event.persisted) {
          hideLoaderImmediately();
          document.querySelector('.topbar') && document.querySelector('.topbar').classList.add('main-content-enter');
          document.querySelector('.main') && document.querySelector('.main').classList.add('main-content-enter');
          document.querySelector('.bottombar') && document.querySelector('.bottombar').classList.add('main-content-enter');
        }
      });

      // Load JSON
      fetch(bankFile)
        .then(function (res) { return res.json(); })
        .then(function (data) {
          RAW_DATA = normalizeQuizData(data);
          init();
          // 在 init 渲染完成后再隐藏 loader
          requestAnimationFrame(function () {
            var loader = document.getElementById('loadingOverlay');
            loader.classList.add('fade-out');
            setTimeout(function() { loader.style.display = 'none'; }, 350);
            document.querySelector('.topbar').classList.add('main-content-enter');
            document.querySelector('.main').classList.add('main-content-enter');
            document.querySelector('.bottombar').classList.add('main-content-enter');
          });
        })
        .catch(function (err) {
          alert('加载题库失败: ' + err.message);
          window.location.href = 'index.html';
        });

      function normalizeQuizData(data) {
        var typeMap = { 'S': '单选题', 'M': '多选题', 'T': '判断题', 'F': '填空题', 'E': '简答题', 'C': '材料题' };
        if (!data) return { questions: [], title: '', total: 0 };
        var qs = data.q || data.questions || [];
        var normalized = [];
        for (var i = 0; i < qs.length; i++) {
          var q = qs[i];
          var opts = q.o || q.options || [];
          var normOpts = [];
          for (var j = 0; j < opts.length; j++) {
            var opt = opts[j];
            if (typeof opt === 'string') {
              var match = opt.match(/^([A-Z])\.\s*(.+)$/);
              if (match) {
                normOpts.push({ label: match[1], content: match[2] });
              } else {
                normOpts.push({ label: '', content: opt });
              }
            } else {
              var cnt = opt.content || '';
              var lbl = opt.label || '';
              if (lbl && cnt.startsWith(lbl + '. ')) {
                cnt = cnt.substring(lbl.length + 2);
              } else if (lbl && cnt.startsWith(lbl + '.')) {
                cnt = cnt.substring(lbl.length + 1);
              }
              normOpts.push({ label: lbl, content: cnt });
            }
          }
          var qtype = q.t || q.type || 'S';
          normalized.push({
            id: String(q.i || q.id || (i + 1)),
            type: typeMap[qtype] || qtype,
            stem: q.s || q.stem || '',
            options: normOpts,
            answer: q.a || q.answer || '',
            analysis: q.x || q.analysis || ''
          });
        }
        return {
          questions: normalized,
          title: data.t || data.title || '',
          total: data.c || data.total || normalized.length
        };
      }

      function init() {
        loadState();
        applyTheme(); applyRandOptsBtn();

        if (!state.order || state.order.length === 0) {
          initSession('normal');
        } else {
          questions = state.order.map(function (idx) { return RAW_DATA.questions[idx]; });
          if (questions.length === 0) initSession('normal');
          current = state.current || 0;
          if (current >= questions.length) current = 0;
        }

        render();
        if (!state.submitted) {
          startTimer();
        }
      }

      function loadState() {
        try {
          // Theme 不再保存到 state，始终从 localStorage 读取
          var globalTheme = localStorage.getItem('uav_quiz_theme');
          if (globalTheme) state.theme = globalTheme;
          var globalRand = localStorage.getItem('uav_quiz_random_opts');
          if (globalRand !== null) state.randomizeOpts = (globalRand === 'true');

          var d = localStorage.getItem(STORAGE_KEY);
          if (d) {
            var parsed = JSON.parse(d);
            if (parsed) {
              // 排除 theme 字段，避免被 state 中的旧值覆盖
              delete parsed.theme;
              state = Object.assign(state, parsed);
            }
          }
        } catch (e) { }
      }

      function saveState() {
        try {
          state.current = current;
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (e) { }
      }

      function initSession(mode, specificIndices) {
        if (mode === 'normal') {
          var indices = [];
          for (var i = 0; i < RAW_DATA.questions.length; i++) indices.push(i);
          state.order = shuffle(indices);
        } else {
          state.order = specificIndices;
        }
        state.records = {};
        state.elapsedSec = 0;
        state.submitted = false;
        state.mode = mode;
        state.current = 0;
        questions = state.order.map(function (idx) { return RAW_DATA.questions[idx]; });
        current = 0;
        saveState();
      }

      function shuffle(arr) {
        for (var i = arr.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
        }
        return arr;
      }

      // ── Timer & Pause ──
      function startTimer() {
        clearInterval(timerInterval);
        if (!manualPaused && !blurPaused && !state.submitted) {
          timerInterval = setInterval(function () {
            state.elapsedSec++;
            saveState();
            renderTimer();
          }, 1000);
        }
        renderTimer();
      }

      function pauseTimer() {
        clearInterval(timerInterval);
      }

      function renderTimer() {
        document.getElementById('timer').textContent = formatTime(state.elapsedSec);
      }
      function formatTime(s) {
        var m = Math.floor(s / 60);
        var sec = s % 60;
        return (m < 10 ? '0' : '') + m + ':' + (sec < 10 ? '0' : '') + sec;
      }

      function handleManualPause() {
        if (state.submitted) return;
        manualPaused = true;
        pauseTimer();
        document.getElementById('pauseOverlay').classList.add('visible');
        document.getElementById('slideWrapper').classList.add('blurred');
      }

      function handleManualResume() {
        if (state.submitted) return;
        manualPaused = false;
        startTimer();
        document.getElementById('pauseOverlay').classList.remove('visible');
        if (!blurPaused && document.hasFocus()) {
          document.getElementById('slideWrapper').classList.remove('blurred');
        }
      }

      function handleBlur() {
        if (state.submitted) return;
        blurPaused = true;
        pauseTimer();
        document.getElementById('slideWrapper').classList.add('blurred');
      }

      function handleFocus() {
        if (state.submitted) return;
        blurPaused = false;
        startTimer();
        if (!manualPaused) {
          document.getElementById('slideWrapper').classList.remove('blurred');
        }
      }

      document.addEventListener('visibilitychange', function () {
        if (document.hidden) handleBlur();
        else handleFocus();
      });
      window.addEventListener('blur', handleBlur);
      window.addEventListener('focus', handleFocus);
      document.getElementById('resumeBtn').addEventListener('click', handleManualResume);
      document.getElementById('timer').addEventListener('click', function(){
        if (!manualPaused) handleManualPause();
      });

      function applyRandOptsBtn() {
        var btn = document.getElementById('randOptsBtn');
        if (btn) {
            if (state.randomizeOpts) {
              btn.style.background = 'var(--primary)';
              btn.style.color = '#fff';
            } else {
              btn.style.background = '';
              btn.style.color = '';
            }
        }
      }
      document.getElementById('randOptsBtn').addEventListener('click', function(){
        state.randomizeOpts = !state.randomizeOpts;
        applyRandOptsBtn();
        try { localStorage.setItem('uav_quiz_random_opts', state.randomizeOpts); } catch(e){}
        saveState();
        renderSlide();
      });


      // ── Theme ──
      function applyTheme() { document.documentElement.setAttribute('data-theme', state.theme); }
      document.getElementById('themeBtn').addEventListener('click', function () {
        state.theme = state.theme === 'light' ? 'dark' : 'light';
        applyTheme(); applyRandOptsBtn();
        try { localStorage.setItem('uav_quiz_theme', state.theme); } catch (e) { }
      });

      // 监听跨标签页/页面的 theme 变化
      window.addEventListener('storage', function (e) {
        if (e.key === 'uav_quiz_theme' && e.newValue) {
          state.theme = e.newValue;
          applyTheme();
          applyRandOptsBtn();
        }
        if (e.key === 'uav_quiz_random_opts') {
          state.randomizeOpts = (e.newValue === 'true');
          applyRandOptsBtn();
        }
      });
      // 页面显示时也同步一次（处理 bfcache 恢复）
      window.addEventListener('pageshow', function (e) {
        var t = localStorage.getItem('uav_quiz_theme');
        if (t && t !== state.theme) {
          state.theme = t;
          applyTheme();
          applyRandOptsBtn();
        }
      });

      // ── Render ──
      function render() {
        renderSlide();
        updateNav();
        updateProgress();
      }

      function escapeHtml(str) {
        var div = document.createElement('div');
        div.appendChild(document.createTextNode(str));
        return div.innerHTML;
      }

      function renderSlide() {
        var wrapper = document.getElementById('slideWrapper');
        wrapper.innerHTML = '';
        var q = questions[current];
        var rec = state.records[q.id];
        var slide = document.createElement('div');
        slide.className = 'slide center';
        slide.innerHTML = buildQuestion(q, rec);
        wrapper.appendChild(slide);
        bindOpts(slide, q);
      }

      function getOptionsOrder(q) {
        var arr = [];
        for(var i=0; i<q.options.length; i++) arr.push(i);
        if (!state.randomizeOpts) return arr;
        
        if (!state.shuffledOpts) state.shuffledOpts = {};
        if (!state.shuffledOpts[q.id]) {
          state.shuffledOpts[q.id] = shuffle(arr);
          saveState();
        }
        return state.shuffledOpts[q.id];
      }

      function buildQuestion(q, rec) {
        var answered = rec !== undefined;
        var showAnswers = state.submitted || answered;

        var h = '<div class="q-num">' + (current + 1) + ' / ' + questions.length + '\u3000' + escapeHtml(q.type) + '</div>';
        h += '<div class="q-stem">' + escapeHtml(q.stem) + '</div>';
        h += '<div class="options">';
        
        var order = getOptionsOrder(q);
        for (var i = 0; i < order.length; i++) {
          var originalIndex = order[i];
          var opt = q.options[originalIndex];
          var optContent = typeof opt === 'string' ? opt : opt.content;
          // displayLabel: 乱序后显示给用户的字母（A/B/C/D 按显示顺序）
          var displayLabel = String.fromCharCode(65 + i);
          // originalLabel: 该选项在原始题库中的字母（用于与 q.answer 比较）
          var originalLabel = (typeof opt === 'object' && opt.label) ? opt.label : String.fromCharCode(65 + originalIndex);

          var cls = 'opt';
          if (showAnswers) {
            cls += ' disabled';
            if (originalLabel === q.answer) cls += ' correct';
            else if (rec && originalLabel === rec.selected && rec.selected !== q.answer) cls += ' wrong';
            else if (!rec || (originalLabel !== q.answer && originalLabel !== rec.selected)) cls += ' dimmed';
          }
          // data-label 存储原始 label，用于答题时与 q.answer 正确比较
          h += '<div class="' + cls + '" data-label="' + originalLabel + '">';
          h += '<span class="label">' + displayLabel + '</span>';
          h += '<span class="content">' + escapeHtml(optContent) + '</span>';
          h += '</div>';
        }
        h += '</div>';
        if (showAnswers && q.analysis) {
          h += '<div class="analysis show"><strong>\u89E3\u6790</strong>\u3000' + escapeHtml(q.analysis).replace(/\n/g, '<br>') + '</div>';
        }
        return h;
      }

      function vibrate(pattern) {
        if (navigator.vibrate) {
          try { navigator.vibrate(pattern); } catch (e) { }
        }
      }

      function bindOpts(slide, q) {
        var opts = slide.querySelectorAll('.opt');
        for (var i = 0; i < opts.length; i++) {
          (function (el) {
            el.addEventListener('click', function () { handleAnswer(el, q); });
          })(opts[i]);
        }
      }

      function handleAnswer(el, q) {
        if (state.records[q.id] !== undefined || state.submitted) return;

        var selected = el.getAttribute('data-label');
        var isCorrect = selected === q.answer;
        state.records[q.id] = { selected: selected, correct: isCorrect };
        saveState();

        if (isCorrect) vibrate(50);
        else vibrate([50, 50, 50]);

        var slide = el.closest('.slide');
        var opts = slide.querySelectorAll('.opt');
        for (var i = 0; i < opts.length; i++) {
          var o = opts[i];
          o.classList.add('disabled');
          // data-label 存储的是原始 label，直接与 q.answer / selected 比较
          var lb = o.getAttribute('data-label');
          if (lb === q.answer) {
            o.classList.add('correct');
            if (isCorrect) o.classList.add('sparkle');
          }
          if (lb === selected && !isCorrect) {
            o.classList.add('wrong');
            o.classList.add('shake');
          }
          if (lb !== q.answer && lb !== selected) o.classList.add('dimmed');
        }

        if (q.analysis) {
          var a = document.createElement('div');
          a.className = 'analysis show';
          a.innerHTML = '<strong>\u89E3\u6790</strong>\u3000' + escapeHtml(q.analysis).replace(/\n/g, '<br>');
          slide.querySelector('.options').insertAdjacentElement('afterend', a);
        }

        if (isCorrect) {
          setTimeout(function () { goNext(); }, 400);
        }
      }

      // ── Nav ──
      var isTransitioning = false;
      function goTo(idx, dir) {
        if (idx < 0 || idx >= questions.length || isTransitioning) return;
        isTransitioning = true;
        var wrapper = document.getElementById('slideWrapper');

        // 立即清除所有残留的旧 slide，防止快速切换重影
        var leftoverSlides = wrapper.querySelectorAll('.slide:not(.center)');
        for (var s = 0; s < leftoverSlides.length; s++) {
          leftoverSlides[s].remove();
        }

        var oldSlide = wrapper.querySelector('.slide.center');
        current = idx;
        saveState();
        updateNav();
        updateProgress();

        var q = questions[current];
        var rec = state.records[q.id];
        var newSlide = document.createElement('div');
        newSlide.className = 'slide ' + (dir === 'next' ? 'right' : 'left');
        newSlide.innerHTML = buildQuestion(q, rec);
        wrapper.appendChild(newSlide);
        bindOpts(newSlide, q);

        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            if (oldSlide) oldSlide.className = 'slide ' + (dir === 'next' ? 'left' : 'right');
            newSlide.className = 'slide center';
            setTimeout(function () {
              if (oldSlide && oldSlide.parentNode) oldSlide.remove();
              isTransitioning = false;
            }, 350);
          });
        });
      }

      function goPrev() { goTo(current - 1, 'prev'); }
      function goNext() { goTo(current + 1, 'next'); }

      function updateNav() {
        var pb = document.getElementById('prevBtn');
        var nb = document.getElementById('nextBtn');
        if (current === 0) pb.classList.add('disabled'); else pb.classList.remove('disabled');
        if (current === questions.length - 1) nb.classList.add('disabled'); else nb.classList.remove('disabled');
        document.getElementById('counter').textContent = (current + 1) + ' / ' + questions.length;

        var subBtn = document.getElementById('submitBtn');
        if (state.submitted) {
          subBtn.textContent = '得分';
          subBtn.classList.add('submitted');
        } else {
          subBtn.textContent = '交卷';
          subBtn.classList.remove('submitted');
        }
      }
      function updateProgress() {
        var pct = ((current + 1) / questions.length) * 100;
        document.getElementById('progressBar').style.width = pct + '%';
      }

      // ── Swipe & Gestures ──
      var touchStartX = 0, touchStartY = 0, swiping = false;
      var wrapperEl = document.getElementById('slideWrapper');
      wrapperEl.addEventListener('touchstart', function (e) {
        touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY; swiping = true;
      }, { passive: true });
      wrapperEl.addEventListener('touchend', function (e) {
        if (!swiping) return; swiping = false;
        var dx = e.changedTouches[0].clientX - touchStartX;
        var dy = e.changedTouches[0].clientY - touchStartY;
        if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.2) { if (dx < 0) goNext(); else goPrev(); }
      }, { passive: true });

      var mouseDown = false, mouseStartX = 0;
      wrapperEl.addEventListener('mousedown', function (e) { mouseDown = true; mouseStartX = e.clientX; });
      wrapperEl.addEventListener('mouseup', function (e) {
        if (!mouseDown) return; mouseDown = false;
        var dx = e.clientX - mouseStartX;
        if (Math.abs(dx) > 60) { if (dx < 0) goNext(); else goPrev(); }
      });
      wrapperEl.addEventListener('mouseleave', function () { mouseDown = false; });

      document.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowLeft') goPrev();
        if (e.key === 'ArrowRight') goNext();
      });

      document.getElementById('prevBtn').addEventListener('click', goPrev);
      document.getElementById('nextBtn').addEventListener('click', goNext);

      // ── Answer Card ──
      var cardOverlay = document.getElementById('cardOverlay');
      document.getElementById('cardBtn').addEventListener('click', openCard);
      document.getElementById('acClose').addEventListener('click', closeCard);
      cardOverlay.addEventListener('click', function (e) { if (e.target === cardOverlay) closeCard(); });

      function openCard() {
        var grid = document.getElementById('acGrid');
        grid.innerHTML = '';
        var doneCount = 0, correctCount = 0, wrongCount = 0;
        for (var i = 0; i < questions.length; i++) {
          var q = questions[i];
          var cell = document.createElement('div');
          cell.className = 'ac-cell';
          cell.textContent = i + 1;
          if (i === current) cell.classList.add('current');

          var rec = state.records[q.id];
          if (rec) {
            doneCount++;
            if (rec.correct) { correctCount++; cell.classList.add('done-correct'); }
            else { wrongCount++; cell.classList.add('done-wrong'); }
          } else if (state.submitted) {
            cell.classList.add('done-wrong');
          }

          (function (idx) {
            cell.addEventListener('click', function () {
              closeCard();
              goTo(idx, idx > current ? 'next' : 'prev');
            });
          })(i);
          grid.appendChild(cell);
        }

        var totalWrong = state.submitted ? (questions.length - correctCount) : wrongCount;
        document.getElementById('acStats').textContent =
          '\u5DF2\u7B54 ' + doneCount + '\u3000\u6B63\u786E ' + correctCount + '\u3000\u9519\u8BEF ' + totalWrong;
        cardOverlay.classList.add('show');
        requestAnimationFrame(function () { cardOverlay.classList.add('visible'); });
      }
      function closeCard() {
        cardOverlay.classList.remove('visible');
        setTimeout(function () { cardOverlay.classList.remove('show'); }, 300);
      }

      // ── Custom Dialog ──
      var dialogOverlay = document.getElementById('dialogOverlay');
      var dialogCancel = document.getElementById('dialogCancel');
      var dialogConfirm = document.getElementById('dialogConfirm');
      var onDialogCancel = null, onDialogConfirm = null;

      function showDialog(title, msg, cancelText, confirmText, cancelCb, confirmCb) {
        document.getElementById('dialogTitle').textContent = title;
        document.getElementById('dialogMsg').textContent = msg;
        dialogCancel.textContent = cancelText;
        dialogConfirm.textContent = confirmText;
        onDialogCancel = cancelCb;
        onDialogConfirm = confirmCb;
        dialogOverlay.classList.add('show');
        requestAnimationFrame(function () { dialogOverlay.classList.add('visible'); });
      }
      function closeDialog() {
        dialogOverlay.classList.remove('visible');
        setTimeout(function () { dialogOverlay.classList.remove('show'); }, 300);
      }
      dialogCancel.addEventListener('click', function () { closeDialog(); if (onDialogCancel) onDialogCancel(); });
      dialogConfirm.addEventListener('click', function () { closeDialog(); if (onDialogConfirm) onDialogConfirm(); });

      // ── Submit & Result ──
      document.getElementById('submitBtn').addEventListener('click', function () {
        if (state.submitted) { showResult(); return; }
        var answeredCount = Object.keys(state.records).length;
        var total = questions.length;
        if (answeredCount < total) {
          showDialog(
            '确认交卷',
            '您完成了 ' + answeredCount + ' / ' + total + ' 道题。还有未做的题目，是否要前往补做？',
            '去补做',
            '强行交卷',
            function () {
              var firstUnanswered = -1;
              for (var i = 0; i < questions.length; i++) {
                if (!state.records[questions[i].id]) { firstUnanswered = i; break; }
              }
              if (firstUnanswered !== -1) goTo(firstUnanswered, firstUnanswered > current ? 'next' : 'prev');
            },
            function () { submitQuiz(); }
          );
        } else {
          showDialog('确认交卷', '您已完成所有题目，确定要交卷吗？', '取消', '确定', null, function () { submitQuiz(); });
        }
      });

      function submitQuiz() {
        pauseTimer();
        state.submitted = true;
        saveState();
        showResult();
      }

      var resOverlay = document.getElementById('resultOverlay');
      function showResult() {
        var correctCount = 0;
        var answeredCount = 0;
        questions.forEach(function (q) {
          var rec = state.records[q.id];
          if (rec) {
            answeredCount++;
            if (rec.correct) correctCount++;
          }
        });
        var score = Math.round((correctCount / questions.length) * 100);
        document.getElementById('scoreVal').textContent = score;
        var unans = questions.length - answeredCount;
        var totalWrong = questions.length - correctCount;

        // 把本次成绩写入 localStorage，主页读取显示
        try {
          var statKey = 'uav_quiz_stat_' + bankFile;
          localStorage.setItem(statKey, JSON.stringify({
            score: score,
            correct: correctCount,
            wrong: totalWrong - unans,
            unanswered: unans,
            total: questions.length,
            time: formatTime(state.elapsedSec),
            timestamp: Date.now()
          }));
        } catch (e) {}

        document.getElementById('scoreStats').textContent = '用时: ' + formatTime(state.elapsedSec) + ' | 错题: ' + (totalWrong - unans) + ' | 未做: ' + unans;
        document.getElementById('redoWrongBtn').style.display = totalWrong > 0 ? 'block' : 'none';

        document.getElementById('exportWrongBtn').style.display = (totalWrong > 0) ? 'block' : 'none';

        resOverlay.classList.add('show');
        requestAnimationFrame(function () { resOverlay.classList.add('visible'); });

        renderSlide();
        updateNav();
      }
      function closeResult() {
        resOverlay.classList.remove('visible');
        setTimeout(function () { resOverlay.classList.remove('show'); }, 300);
      }

      // 关闭成绩界面：已交卷时直接回主页，否则关闭弹窗
      document.getElementById('resultCloseBtn').addEventListener('click', function (e) {
        e.stopPropagation();
        if (state.submitted) {
          // 用 replace 替换历史记录，按返回不会回到 quiz.html
          window.location.replace('index.html');
        } else {
          closeResult();
        }
      });
      // 点击遮罩也可以关闭
      resOverlay.addEventListener('click', function (e) {
        if (e.target === resOverlay) {
          if (state.submitted) {
            window.location.replace('index.html');
          } else {
            closeResult();
          }
        }
      });

      function exportWrongQuestions() {
        var wrongList = [];
        questions.forEach(function(q) {
          var rec = state.records[q.id];
          if (!rec || !rec.correct) {
            var optionsText = q.options.map(function(o) {
              return o.label + '. ' + o.content;
            }).join('\n');
            wrongList.push({
              id: q.id,
              type: q.type,
              question: q.stem,
              options: optionsText,
              your_answer: rec ? rec.answer : '未作答',
              correct_answer: q.answer,
              analysis: q.analysis || '暂无解析'
            });
          }
        });
        
        var exportData = {
          timestamp: new Date().toISOString(),
          total_questions: questions.length,
          wrong_count: wrongList.length,
          questions: wrongList
        };
        
        var text = JSON.stringify(exportData, null, 2);
        navigator.clipboard.writeText(text).then(function() {
          showDialog('复制成功', '已复制 ' + wrongList.length + ' 道错题到剪贴板', '', '好的', null, function() { closeDialog(); });
        }).catch(function(err) {
          var textarea = document.createElement('textarea');
          textarea.value = text;
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand('copy');
          document.body.removeChild(textarea);
          showDialog('复制成功', '已复制 ' + wrongList.length + ' 道错题到剪贴板', '', '好的', null, function() { closeDialog(); });
        });
      }

      document.getElementById('exportWrongBtn').addEventListener('click', exportWrongQuestions);
      document.getElementById('restartBtn').addEventListener('click', function () {
        closeResult();
        initSession('normal');
        startTimer();
        render();
      });
      document.getElementById('redoWrongBtn').addEventListener('click', function () {
        closeResult();
        var wrongIndices = [];
        state.order.forEach(function (idx) {
          var q = RAW_DATA.questions[idx];
          var rec = state.records[q.id];
          if (!rec || !rec.correct) wrongIndices.push(idx); // unanswered or wrong
        });
        initSession('redo_wrong', wrongIndices);
        startTimer();
        render();
      });

      // ── Screenshot Report ──
      document.getElementById('screenshotBtn').addEventListener('click', function () {
        closeResult();

        // Fill data
        var correctCount = 0;
        var answeredCount = 0;
        questions.forEach(function (q) {
          var rec = state.records[q.id];
          if (rec) {
            answeredCount++;
            if (rec.correct) correctCount++;
          }
        });
        var score = Math.round((correctCount / questions.length) * 100);
        var wrongCount = questions.length - correctCount;

        var titleMap = {
          '题库_无人机法律法规.json': '无人机法律法规',
          '题库_20260702.json': '题库 1',
          '题库_20260702 (1).json': '题库 2',
          '题库_20260702 (2).json': '题库 3',
          '题库_20260702 (3).json': '题库 4',
          '题库_20260702 (4).json': '题库 5',
          '题库_20260702 (5).json': '题库 6'
        };

        document.getElementById('reportScore').textContent = score;
        document.getElementById('reportTotal').textContent = questions.length + '题';
        document.getElementById('reportCorrect').textContent = correctCount + '题';
        document.getElementById('reportTime').textContent = formatTime(state.elapsedSec);

        var report = document.getElementById('reportOverlay');
        report.classList.add('show');
        requestAnimationFrame(function () { report.classList.add('visible'); });
      });

      document.getElementById('reportClose').addEventListener('click', function () {
        var report = document.getElementById('reportOverlay');
        report.classList.remove('visible');
        setTimeout(function () { report.classList.remove('show'); showResult(); }, 300);
      });

      document.getElementById('reportClose2').addEventListener('click', function () {
        var report = document.getElementById('reportOverlay');
        report.classList.remove('visible');
        setTimeout(function () { report.classList.remove('show'); showResult(); }, 300);
      });

      document.getElementById('reportReviewBtn').addEventListener('click', function () {
        var report = document.getElementById('reportOverlay');
        report.classList.remove('visible');
        setTimeout(function () { report.classList.remove('show'); }, 300);
        enterReview();
      });

    })();
  </script>

</body>
