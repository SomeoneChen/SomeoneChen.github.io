<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Lumina Gallery | 极致照片墙</title>
  <script type="module" crossorigin src="/assets/index-wFU0ARaO.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-B-_Gi5ya.css">
</head>
<body>
<div id="app">

    <!-- 顶部加载进度条 -->
    <div id="progress-bar"><div id="progress-fill"></div></div>

    <!-- 玻璃拟态顶部导航 -->
    <header id="app-header">
        <div class="header-inner">
            <div class="logo">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
                </svg>
                <span>Lumina</span>
            </div>
            <div id="photo-count" class="photo-count"></div>
            <div class="header-actions">
                <button id="filter-toggle-btn" class="icon-btn" title="筛选与排序">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/>
                        <line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/>
                        <line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <!-- 筛选/排序抽屉 -->
    <aside id="filter-drawer" class="filter-drawer closed">
        <div class="drawer-header">
            <span>排列与筛选</span>
            <button id="filter-close-btn" class="icon-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </button>
        </div>
        <div class="drawer-body">
            <div class="filter-group">
                <label>排序方式</label>
                <div class="chip-group" id="sort-chips">
                    <span class="chip active" data-sort="date">📅 拍摄日期</span>
                    <span class="chip" data-sort="name">🔤 文件名</span>
                    <span class="chip" data-sort="size">📦 文件大小</span>
                </div>
            </div>
            <div class="filter-group">
                <label>按设备筛选</label>
                <div class="chip-group" id="camera-chips">
                    <span class="chip active" data-camera="all">全部</span>
                </div>
            </div>
            <div class="filter-group">
                <label>按拍摄者</label>
                <div class="chip-group" id="author-chips">
                    <span class="chip active" data-author="all">全部</span>
                </div>
            </div>
        </div>
    </aside>
    <div id="drawer-overlay" class="overlay hidden"></div>

    <!-- 照片网格 -->
    <main id="photo-grid"></main>

    <!-- 灯箱 -->
    <div id="lightbox" class="lightbox hidden">
        <button id="lb-close" class="lb-close-btn" aria-label="关闭">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
        </button>

        <!-- 图片查看区 (支持缩放拖拽) -->
        <div id="lb-stage">
            <img id="lb-img" src="" alt="预览图" draggable="false">
        </div>

        <!-- 底部信息面板 -->
        <div id="lb-info-panel">
            <!-- 加载大图进度 -->
            <div id="lb-load-progress-wrap" class="hidden">
                <div id="lb-load-progress-bar"></div>
            </div>
            <div class="lb-info-bar" id="lb-info-bar">
                <div class="lb-filename" id="lb-filename"></div>
                <button id="lb-detail-toggle" class="icon-btn" title="查看EXIF详情">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/>
                        <line x1="12" y1="16" x2="12.01" y2="16"/>
                    </svg>
                </button>
            </div>
            <div id="lb-detail" class="lb-detail hidden">
                <div class="exif-grid" id="exif-grid"></div>
                <div id="lb-map" class="lb-map hidden"></div>
            </div>
        </div>
    </div>

    <!-- 底部时间线 -->
    <div id="timeline-bar">
        <div class="timeline-icon">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/>
                <line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
        </div>
        <div id="timeline-track-wrapper">
            <div id="timeline-track">
                <div id="timeline-fill"></div>
            </div>
            <div id="timeline-thumb"></div>
            <div id="timeline-tooltip">--</div>
        </div>
        <div id="timeline-label">--</div>
    </div>

</div>
</body>
</html>
