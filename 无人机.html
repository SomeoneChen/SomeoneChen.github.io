<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>无人机法规 · 练习</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600&display=swap');

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

:root {
  --bg: #f5f8fc;
  --card: #fff;
  --primary: #3a7bd5;
  --accent: #5bb8f5;
  --water: #e8f4fd;
  --text: #2c3e50;
  --sub: #8a9bb5;
  --correct: #4caf93;
  --wrong: #e06c75;
  --border: #e4ecf5;
  --overlay: rgba(44,62,80,.3);
  --header-bg: rgba(255,255,255,.88);
}
[data-theme="dark"] {
  --bg: #121212;
  --card: #1e1e1e;
  --primary: #4a90e2;
  --accent: #63b3ed;
  --water: #1a2635;
  --text: #e0e0e0;
  --sub: #8899a6;
  --correct: #3a9679;
  --wrong: #d35f67;
  --border: #2c2c2c;
  --overlay: rgba(0,0,0,.6);
  --header-bg: rgba(30,30,30,.88);
}

html,body{
  height:100%;
  font-family:'Noto Sans SC','Hiragino Sans','PingFang SC',sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow:hidden;
  font-weight:400;
  -webkit-font-smoothing:antialiased;
  transition: background 0.3s, color 0.3s;
}

/* ── top bar ── */
.topbar{
  position:fixed;top:0;left:0;right:0;
  height:52px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;
  background:var(--header-bg);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  z-index:100;
  font-size:14px;
}
.left-actions, .right-actions { display:flex; align-items:center; gap:8px; }
.timer{
  font-variant-numeric:tabular-nums;
  color:var(--text);
  font-weight:500;
  font-size:15px;
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
}
.icon-btn{
  width:32px;height:32px;
  display:flex;align-items:center;justify-content:center;
  border:none;background:var(--water);
  border-radius:8px;cursor:pointer;
  color:var(--primary);
  transition:background .2s;
}
.icon-btn:active{background:var(--border)}
.icon-btn svg{width:18px;height:18px;}
.moon-icon{display:none;}
[data-theme="dark"] .sun-icon{display:none;}
[data-theme="dark"] .moon-icon{display:block;}

.text-btn {
  border:none; background:var(--primary); color:#fff;
  padding:6px 14px; border-radius:8px; font-size:13px; font-weight:500;
  cursor:pointer; transition:transform 0.15s, background 0.2s, color 0.2s;
}
.text-btn:active { transform:scale(0.95); }
.text-btn.submitted { background:var(--water); color:var(--primary); }

/* ── progress ── */
.progress-track{
  position:fixed;top:52px;left:0;right:0;
  height:2px;background:var(--border);z-index:99;
}
.progress-bar{
  height:100%;
  background:linear-gradient(90deg,var(--primary),var(--accent));
  transition:width .35s cubic-bezier(.4,0,.2,1);
  border-radius:0 1px 1px 0;
}

/* ── main container ── */
.main{
  position:fixed;
  top:54px;bottom:56px;left:0;right:0;
  overflow:hidden;
}

/* ── slide wrapper ── */
.slide-wrapper{
  width:100%;height:100%;
  position:relative;
}
.slide{
  position:absolute;
  top:0;left:0;right:0;bottom:0;
  padding:20px 16px 32px;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  will-change:transform,opacity;
  transition:transform .32s cubic-bezier(.4,0,.2,1),opacity .32s cubic-bezier(.4,0,.2,1);
}
.slide.center{transform:translateX(0);opacity:1}
.slide.left{transform:translateX(-40%);opacity:0;pointer-events:none}
.slide.right{transform:translateX(40%);opacity:0;pointer-events:none}

/* ── question card ── */
.q-num{
  font-size:12px;
  color:var(--sub);
  margin-bottom:8px;
  font-weight:400;
  letter-spacing:.3px;
}
.q-stem{
  font-size:16px;
  line-height:1.6;
  font-weight:500;
  margin-bottom:24px;
  color:var(--text);
  word-break:break-word;
}

/* ── options ── */
.options{display:flex;flex-direction:column;gap:12px}
.opt{
  position:relative;
  display:flex;align-items:flex-start;
  padding:14px 16px;
  background:var(--card);
  border:1.5px solid var(--border);
  border-radius:12px;
  cursor:pointer;
  transition:border-color .18s,background .18s,transform .18s;
  -webkit-user-select:none;user-select:none;
}
.opt:active:not(.disabled){transform:scale(.98)}
.opt .label{
  flex-shrink:0;
  width:26px;height:26px;
  display:flex;align-items:center;justify-content:center;
  border-radius:6px;
  background:var(--water);
  font-size:13px;
  font-weight:600;
  color:var(--primary);
  margin-right:12px;
  transition:background .18s,color .18s;
}
.opt .content{
  font-size:15px;
  line-height:1.5;
  padding-top:2px;
  color:var(--text);
}
.opt.selected{border-color:var(--primary);background:var(--water)}
.opt.selected .label{background:var(--primary);color:#fff}
.opt.correct{border-color:var(--correct);background:rgba(76,175,147,0.1)}
.opt.correct .label{background:var(--correct);color:#fff}
.opt.wrong{border-color:var(--wrong);background:rgba(224,108,117,0.1)}
.opt.wrong .label{background:var(--wrong);color:#fff}
.opt.disabled{pointer-events:none}
.opt.dimmed{opacity:.45}

/* ── analysis ── */
.analysis{
  margin-top:20px;
  padding:16px;
  background:var(--water);
  border-radius:12px;
  font-size:14px;
  line-height:1.7;
  color:var(--sub);
  display:none;
  animation:fadeUp .3s ease-out;
}
.analysis.show{display:block}
.analysis strong{color:var(--text);font-weight:600}

/* ── animations ── */
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  50% { transform: translateX(6px); }
  75% { transform: translateX(-6px); }
}
.opt.wrong.shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }

@keyframes sparkle {
  0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(76,175,147,.4); }
  50% { transform: scale(1.03); box-shadow: 0 0 0 15px rgba(76,175,147,0); }
  100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(76,175,147,0); }
}
.opt.correct.sparkle { animation: sparkle 0.5s ease-out both; }

@keyframes fadeUp{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}
}

/* ── Modals ── */
.modal-overlay{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:var(--overlay);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  z-index:200;
  display:none;
  opacity:0;
  transition:opacity .3s;
}
.modal-overlay.show{display:flex;}
.modal-overlay.visible{opacity:1}

/* Answer Card */
.modal-overlay.ac-wrapper { align-items:flex-end; justify-content:center; }
.answer-card{
  width:100%;max-width:480px;
  max-height:80vh;
  background:var(--card);
  border-radius:24px 24px 0 0;
  padding:24px 20px 32px;
  overflow-y:auto;
  transform:translateY(100%);
  transition:transform .4s cubic-bezier(.175,.885,.32,1.1);
  box-shadow: 0 -4px 24px rgba(0,0,0,0.06);
}
.modal-overlay.visible .answer-card{transform:translateY(0)}

.ac-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:20px;
}
.ac-header h3{font-size:16px;font-weight:600;color:var(--text)}
.ac-stats{font-size:13px;color:var(--sub)}
.ac-close{
  width:32px;height:32px;display:flex;align-items:center;justify-content:center;
  border:none;background:var(--bg);border-radius:10px;cursor:pointer;
}
.ac-close svg{width:16px;height:16px;color:var(--sub)}

.ac-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(42px,1fr));
  gap:10px;
}
.ac-cell{
  aspect-ratio:1;
  display:flex;align-items:center;justify-content:center;
  border-radius:10px;
  font-size:14px;
  font-weight:500;
  cursor:pointer;
  border:1.5px solid var(--border);
  background:var(--bg);
  color:var(--sub);
  transition:transform .15s,border-color .15s;
}
.ac-cell:active{transform:scale(.92)}
.ac-cell.done-correct{
  background:rgba(76,175,147,0.1);border-color:var(--correct);color:var(--correct);
}
.ac-cell.done-wrong{
  background:rgba(224,108,117,0.1);border-color:var(--wrong);color:var(--wrong);
}
.ac-cell.current{
  border-color:var(--primary);color:var(--primary);background:var(--water);
}

/* Dialog */
.modal-overlay.dialog-wrapper { align-items:center; justify-content:center; }
.dialog {
  width: 320px;
  background: var(--card);
  border-radius: 20px;
  padding: 24px;
  text-align: center;
  box-shadow: 0 10px 40px rgba(0,0,0,0.15);
  transform: scale(0.9);
  transition: transform 0.3s cubic-bezier(.175,.885,.32,1.275);
}
.modal-overlay.visible .dialog { transform: scale(1); }
.dialog-title { font-size: 18px; font-weight: 600; color: var(--text); margin-bottom: 12px; }
.dialog-msg { font-size: 14px; color: var(--sub); line-height: 1.6; margin-bottom: 24px; }
.dialog-actions { display: flex; gap: 12px; }
.dialog-btn {
  flex: 1; padding: 12px 0; border-radius: 10px; border: none; font-size: 15px; font-weight: 500; cursor: pointer; transition: 0.2s;
}
.dialog-btn:active { transform: scale(0.96); }
.dialog-btn.secondary { background: var(--water); color: var(--text); }
.dialog-btn.primary { background: var(--primary); color: #fff; }

/* Result Card */
.modal-overlay.result-wrapper { align-items:center; justify-content:center; }
.result-card {
  width: 90%; max-width: 340px;
  background: var(--card);
  border-radius: 24px;
  padding: 32px 24px;
  text-align: center;
  box-shadow: 0 10px 40px rgba(0,0,0,0.2);
  transform: scale(0.9);
  transition: transform 0.3s cubic-bezier(.175,.885,.32,1.275);
}
.modal-overlay.visible .result-card { transform: scale(1); }
.score-title { font-size: 16px; color: var(--sub); font-weight: 500; }
.score-val { font-size: 80px; font-weight: 700; color: var(--primary); margin: 8px 0; line-height: 1; font-family: system-ui, -apple-system, sans-serif; letter-spacing: -2px;}
.score-stats { font-size: 14px; color: var(--sub); margin-bottom: 32px; background:var(--bg); padding:10px; border-radius:12px; }
.res-btn {
  width: 100%; padding: 14px; border-radius: 12px; border: none; font-size: 15px; font-weight: 500; cursor: pointer; margin-bottom: 12px; transition: 0.2s;
}
.res-btn:active { transform: scale(0.97); }
.res-btn.primary { background: var(--primary); color: #fff; }
.res-btn.outline { background: transparent; border: 1.5px solid var(--primary); color: var(--primary); }
.res-btn.secondary { background: var(--water); color: var(--text); margin-bottom: 0; }


/* ── bottom nav ── */
.bottombar{
  position:fixed;bottom:0;left:0;right:0;
  height:56px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;
  background:var(--header-bg);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--border);
  z-index:50;
}
.nav-btn{
  display:flex;align-items:center;gap:4px;
  border:none;background:none;
  font-size:14px;font-weight:500;color:var(--text);
  cursor:pointer;
  padding:8px 12px;
  border-radius:8px;
  transition:background .15s,color .15s;
  font-family:inherit;
}
.nav-btn:active{background:var(--water)}
.nav-btn svg{width:18px;height:18px}
.nav-btn.disabled{opacity:.3;pointer-events:none}
.counter{
  font-size:14px;color:var(--sub);
  font-variant-numeric:tabular-nums;
  font-weight:500;
}

/* ── scrollbar ── */
.slide::-webkit-scrollbar{width:0}
.answer-card::-webkit-scrollbar{width:4px}
.answer-card::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* ── safe area ── */
@supports(padding-bottom:env(safe-area-inset-bottom)){
  .bottombar{padding-bottom:env(safe-area-inset-bottom);height:calc(56px + env(safe-area-inset-bottom))}
  .main{bottom:calc(56px + env(safe-area-inset-bottom))}
  .modal-overlay .answer-card{padding-bottom:calc(32px + env(safe-area-inset-bottom))}
}
</style>
</head>

<!-- Answer Card Modal -->
<div class="modal-overlay ac-wrapper" id="cardOverlay">

<!-- Dialog Modal -->

</div>

<div class="modal-overlay result-wrapper" id="resultOverlay">
  <div class="result-card">

    </div>
  </div>
</div>

<script>
(function(){
  var RAW_DATA = JSON.parse(document.getElementById('questionData').textContent.trim());
  var state = {
    theme: 'light',
    order: [],
    records: {},
    elapsedSec: 0,
    lastSaved: Date.now(),
    submitted: false,
    mode: 'normal' // 'normal' | 'redo_wrong'
  };
  var questions = [];
  var current = 0;
  var timerInterval;

  function init(){
    loadState();
    applyTheme();

    if (!state.order || state.order.length === 0) {
      initSession('normal');
    } else {
      questions = state.order.map(function(idx){ return RAW_DATA.questions[idx]; });
      if (questions.length === 0) initSession('normal'); // fallback
    }

    startTimer();
    render();
  }

  function loadState() {
    try {
      var d = localStorage.getItem('uav_quiz_state');
      if (d) {
        var parsed = JSON.parse(d);
        if (parsed) {
          state = Object.assign(state, parsed);
          // Resume timer if not submitted
          if (!state.submitted) state.lastSaved = Date.now();
        }
      }
    } catch(e) {}
  }

  function saveState() {
    try { localStorage.setItem('uav_quiz_state', JSON.stringify(state)); } catch(e){}
  }

  function initSession(mode, specificIndices) {
    if (mode === 'normal') {
      var indices = [];
      for (var i = 0; i < RAW_DATA.questions.length; i++) indices.push(i);
      state.order = shuffle(indices);
    } else {
      state.order = specificIndices;
    }
    state.records = {};
    state.elapsedSec = 0;
    state.lastSaved = Date.now();
    state.submitted = false;
    state.mode = mode;
    questions = state.order.map(function(idx){ return RAW_DATA.questions[idx]; });
    current = 0;
    saveState();
  }

  function shuffle(arr){
    for(var i=arr.length-1;i>0;i--){
      var j=Math.floor(Math.random()*(i+1));
      var t=arr[i];arr[i]=arr[j];arr[j]=t;
    }
    return arr;
  }

  // ── Timer ──
  function startTimer(){
    clearInterval(timerInterval);
    timerInterval = setInterval(updateTimer, 1000);
    renderTimer();
  }
  function updateTimer(){
    if (state.submitted) return;
    var now = Date.now();
    var diff = Math.floor((now - state.lastSaved) / 1000);
    if (diff > 0) {
      state.elapsedSec += diff;
      state.lastSaved = now;
      saveState();
      renderTimer();
    }
  }
  function renderTimer() {
    document.getElementById('timer').textContent = formatTime(state.elapsedSec);
  }
  function formatTime(s) {
    var m = Math.floor(s / 60);
    var sec = s % 60;
    return (m < 10 ? '0' : '') + m + ':' + (sec < 10 ? '0' : '') + sec;
  }

  // ── Theme ──
  function applyTheme() { document.documentElement.setAttribute('data-theme', state.theme); }
  document.getElementById('themeBtn').addEventListener('click', function(){
    state.theme = state.theme === 'light' ? 'dark' : 'light';
    applyTheme();
    saveState();
  });

  // ── Render ──
  function render(){
    renderSlide();
    updateNav();
    updateProgress();
  }

  function escapeHtml(str){
    var div=document.createElement('div');
    div.appendChild(document.createTextNode(str));
    return div.innerHTML;
  }

  function renderSlide(){
    var wrapper=document.getElementById('slideWrapper');
    wrapper.innerHTML='';
    var q=questions[current];
    var rec=state.records[q.id];
    var slide=document.createElement('div');
    slide.className='slide center';
    slide.innerHTML=buildQuestion(q,rec);
    wrapper.appendChild(slide);
    bindOpts(slide,q);
  }

  function buildQuestion(q, rec){
    var answered = rec !== undefined;
    var showAnswers = state.submitted || answered;
    
    var h='<div class="q-num">'+(current+1)+' / '+questions.length+'\u3000'+escapeHtml(q.type)+'</div>';
    h+='<div class="q-stem">'+escapeHtml(q.stem)+'</div>';
    h+='<div class="options">';
    for(var i=0;i<q.options.length;i++){
      var opt=q.options[i];
      var cls='opt';
      if(showAnswers){
        cls+=' disabled';
        if(opt.label===q.answer) cls+=' correct';
        else if(rec && opt.label===rec.selected && rec.selected!==q.answer) cls+=' wrong';
        else if(!rec || (opt.label!==q.answer && opt.label!==rec.selected)) cls+=' dimmed';
      }
      h+='<div class="'+cls+'" data-label="'+opt.label+'">';
      h+='<span class="label">'+opt.label+'</span>';
      h+='<span class="content">'+escapeHtml(opt.content)+'</span>';
      h+='</div>';
    }
    h+='</div>';
    if(showAnswers && q.analysis){
      h+='<div class="analysis show"><strong>\u89E3\u6790</strong>\u3000'+escapeHtml(q.analysis).replace(/\n/g,'<br>')+'</div>';
    }
    return h;
  }

  function bindOpts(slide,q){
    var opts=slide.querySelectorAll('.opt');
    for(var i=0;i<opts.length;i++){
      (function(el){
        el.addEventListener('click',function(){handleAnswer(el,q);});
      })(opts[i]);
    }
  }

  function handleAnswer(el,q){
    if(state.records[q.id] !== undefined || state.submitted) return;
    
    var selected = el.getAttribute('data-label');
    var isCorrect = selected === q.answer;
    state.records[q.id] = { selected: selected, correct: isCorrect };
    saveState();

    var slide = el.closest('.slide');
    var opts = slide.querySelectorAll('.opt');
    for(var i=0; i<opts.length; i++){
      var o = opts[i];
      o.classList.add('disabled');
      var lb = o.getAttribute('data-label');
      if(lb === q.answer){
        o.classList.add('correct');
        if(isCorrect) o.classList.add('sparkle');
      }
      if(lb === selected && !isCorrect) {
        o.classList.add('wrong');
        o.classList.add('shake');
      }
      if(lb !== q.answer && lb !== selected) o.classList.add('dimmed');
    }

    if(q.analysis){
      var a = document.createElement('div');
      a.className = 'analysis show';
      a.innerHTML = '<strong>\u89E3\u6790</strong>\u3000' + escapeHtml(q.analysis).replace(/\n/g, '<br>');
      slide.querySelector('.options').insertAdjacentElement('afterend', a);
    }

    if(isCorrect){
      setTimeout(function(){ goNext(); }, 400);
    }
  }

  // ── Nav ──
  function goTo(idx,dir){
    if(idx<0||idx>=questions.length) return;
    var wrapper=document.getElementById('slideWrapper');
    var oldSlide=wrapper.querySelector('.slide.center');
    current=idx;
    updateNav();
    updateProgress();

    var q=questions[current];
    var rec=state.records[q.id];
    var newSlide=document.createElement('div');
    newSlide.className='slide '+(dir==='next'?'right':'left');
    newSlide.innerHTML=buildQuestion(q,rec);
    wrapper.appendChild(newSlide);
    bindOpts(newSlide,q);

    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        if(oldSlide) oldSlide.className='slide '+(dir==='next'?'left':'right');
        newSlide.className='slide center';
      });
    });
    setTimeout(function(){if(oldSlide&&oldSlide.parentNode)oldSlide.remove();},350);
  }

  function goPrev(){goTo(current-1,'prev');}
  function goNext(){goTo(current+1,'next');}

  function updateNav(){
    var pb=document.getElementById('prevBtn');
    var nb=document.getElementById('nextBtn');
    if(current===0) pb.classList.add('disabled'); else pb.classList.remove('disabled');
    if(current===questions.length-1) nb.classList.add('disabled'); else nb.classList.remove('disabled');
    document.getElementById('counter').textContent=(current+1)+' / '+questions.length;
    
    var subBtn = document.getElementById('submitBtn');
    if (state.submitted) {
      subBtn.textContent = '得分';
      subBtn.classList.add('submitted');
    } else {
      subBtn.textContent = '交卷';
      subBtn.classList.remove('submitted');
    }
  }
  function updateProgress(){
    var pct=((current+1)/questions.length)*100;
    document.getElementById('progressBar').style.width=pct+'%';
  }

  // ── Swipe & Gestures ──
  var touchStartX=0,touchStartY=0,swiping=false;
  var wrapperEl=document.getElementById('slideWrapper');
  wrapperEl.addEventListener('touchstart',function(e){
    touchStartX=e.touches[0].clientX; touchStartY=e.touches[0].clientY; swiping=true;
  },{passive:true});
  wrapperEl.addEventListener('touchend',function(e){
    if(!swiping)return; swiping=false;
    var dx=e.changedTouches[0].clientX-touchStartX;
    var dy=e.changedTouches[0].clientY-touchStartY;
    if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.2){ if(dx<0) goNext(); else goPrev(); }
  },{passive:true});

  var mouseDown=false,mouseStartX=0;
  wrapperEl.addEventListener('mousedown',function(e){mouseDown=true;mouseStartX=e.clientX;});
  wrapperEl.addEventListener('mouseup',function(e){
    if(!mouseDown)return; mouseDown=false;
    var dx=e.clientX-mouseStartX;
    if(Math.abs(dx)>60){ if(dx<0) goNext(); else goPrev(); }
  });
  wrapperEl.addEventListener('mouseleave',function(){mouseDown=false;});

  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowLeft') goPrev();
    if(e.key==='ArrowRight') goNext();
  });

  document.getElementById('prevBtn').addEventListener('click',goPrev);
  document.getElementById('nextBtn').addEventListener('click',goNext);

  // ── Answer Card ──
  var cardOverlay=document.getElementById('cardOverlay');
  document.getElementById('cardBtn').addEventListener('click',openCard);
  document.getElementById('acClose').addEventListener('click',closeCard);
  cardOverlay.addEventListener('click',function(e){if(e.target===cardOverlay)closeCard();});

  function openCard(){
    var grid=document.getElementById('acGrid');
    grid.innerHTML='';
    var doneCount=0,correctCount=0,wrongCount=0;
    for(var i=0;i<questions.length;i++){
      var q=questions[i];
      var cell=document.createElement('div');
      cell.className='ac-cell';
      cell.textContent=i+1;
      if(i===current) cell.classList.add('current');
      
      var rec=state.records[q.id];
      if(rec){
        doneCount++;
        if(rec.correct){correctCount++;cell.classList.add('done-correct');}
        else{wrongCount++;cell.classList.add('done-wrong');}
      } else if (state.submitted) {
        cell.classList.add('done-wrong');
      }
      
      (function(idx){
        cell.addEventListener('click',function(){
          closeCard();
          goTo(idx,idx>current?'next':'prev');
        });
      })(i);
      grid.appendChild(cell);
    }
    
    var totalWrong = state.submitted ? (questions.length - correctCount) : wrongCount;
    document.getElementById('acStats').textContent=
      '\u5DF2\u7B54 '+doneCount+'\u3000\u6B63\u786E '+correctCount+'\u3000\u9519\u8BEF '+totalWrong;
    cardOverlay.classList.add('show');
    requestAnimationFrame(function(){cardOverlay.classList.add('visible');});
  }
  function closeCard(){
    cardOverlay.classList.remove('visible');
    setTimeout(function(){cardOverlay.classList.remove('show');},300);
  }

  // ── Custom Dialog ──
  var dialogOverlay = document.getElementById('dialogOverlay');
  var dialogCancel = document.getElementById('dialogCancel');
  var dialogConfirm = document.getElementById('dialogConfirm');
  var onDialogCancel = null, onDialogConfirm = null;

  function showDialog(title, msg, cancelText, confirmText, cancelCb, confirmCb) {
    document.getElementById('dialogTitle').textContent = title;
    document.getElementById('dialogMsg').textContent = msg;
    dialogCancel.textContent = cancelText;
    dialogConfirm.textContent = confirmText;
    onDialogCancel = cancelCb;
    onDialogConfirm = confirmCb;
    dialogOverlay.classList.add('show');
    requestAnimationFrame(function(){ dialogOverlay.classList.add('visible'); });
  }
  function closeDialog() {
    dialogOverlay.classList.remove('visible');
    setTimeout(function(){ dialogOverlay.classList.remove('show'); }, 300);
  }
  dialogCancel.addEventListener('click', function(){ closeDialog(); if(onDialogCancel) onDialogCancel(); });
  dialogConfirm.addEventListener('click', function(){ closeDialog(); if(onDialogConfirm) onDialogConfirm(); });

  // ── Submit & Result ──
  document.getElementById('submitBtn').addEventListener('click', function(){
    if (state.submitted) { showResult(); return; }
    var answeredCount = Object.keys(state.records).length;
    var total = questions.length;
    if (answeredCount < total) {
      showDialog(
        '确认交卷',
        '您完成了 ' + answeredCount + ' / ' + total + ' 道题。还有未做的题目，是否要前往补做？',
        '去补做',
        '强行交卷',
        function() {
          var firstUnanswered = -1;
          for (var i = 0; i < questions.length; i++) {
            if (!state.records[questions[i].id]) { firstUnanswered = i; break; }
          }
          if (firstUnanswered !== -1) goTo(firstUnanswered, firstUnanswered > current ? 'next' : 'prev');
        },
        function() { submitQuiz(); }
      );
    } else {
      showDialog('确认交卷', '您已完成所有题目，确定要交卷吗？', '取消', '确定', null, function(){ submitQuiz(); });
    }
  });

  function submitQuiz() {
    state.submitted = true;
    saveState();
    showResult();
  }

  var resOverlay = document.getElementById('resultOverlay');
  function showResult() {
    var correctCount = 0;
    var answeredCount = 0;
    questions.forEach(function(q) {
      var rec = state.records[q.id];
      if (rec) {
        answeredCount++;
        if (rec.correct) correctCount++;
      }
    });
    var score = Math.round((correctCount / questions.length) * 100);
    document.getElementById('scoreVal').textContent = score;
    var wrong = correctCount >= answeredCount ? (questions.length - correctCount) : (answeredCount - correctCount + questions.length - answeredCount);
    // actually, wrong is total - correct
    var unans = questions.length - answeredCount;
    var totalWrong = questions.length - correctCount;
    
    document.getElementById('scoreStats').textContent = '用时: ' + formatTime(state.elapsedSec) + ' | 错题: ' + (totalWrong - unans) + ' | 未做: ' + unans;
    document.getElementById('redoWrongBtn').style.display = totalWrong > 0 ? 'block' : 'none';
    
    resOverlay.classList.add('show');
    requestAnimationFrame(function(){ resOverlay.classList.add('visible'); });
    
    renderSlide();
    updateNav();
  }
  function closeResult() {
    resOverlay.classList.remove('visible');
    setTimeout(function(){ resOverlay.classList.remove('show'); }, 300);
  }

  document.getElementById('reviewBtn').addEventListener('click', closeResult);
  document.getElementById('restartBtn').addEventListener('click', function() {
    closeResult();
    initSession('normal');
    render();
  });
  document.getElementById('redoWrongBtn').addEventListener('click', function() {
    closeResult();
    var wrongIndices = [];
    state.order.forEach(function(idx) {
      var q = RAW_DATA.questions[idx];
      var rec = state.records[q.id];
      if (!rec || !rec.correct) wrongIndices.push(idx); // unanswered or wrong
    });
    initSession('redo_wrong', wrongIndices);
    render();
  });

  init();
})();
</script>

</body>
</html>
